<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進捗管理</title>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Hiragino Sans",Meiryo,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0 6px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}
  header h1 .dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}
  header h1 .dot.ok{background:#22c55e;box-shadow:0 0 6px #22c55e}header h1 .dot.ng{background:#ef4444}
  .sp{flex:1}
  main{flex:1;min-height:0;overflow:auto;padding:10px 16px}
  section{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06);max-width:1600px;margin:0 auto}
  input,select{font:inherit;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
  button{font:inherit;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;background:#e5e7eb}
  button.sm{padding:2px 8px;font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
  th{position:sticky;top:0;background:#f9fafb;font-weight:600;color:var(--sub)}
  .hint{color:var(--sub);font-size:12px}
  .tabs{display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
  .tabs button{border-radius:0;background:#fff;padding:4px 14px}
  .tabs button.on{background:#111827;color:#fff}
  .dt{display:inline-flex;align-items:center;gap:4px}
  .dt button{padding:4px 9px;background:#fff;border:1px solid #d1d5db}
  .dt.off{display:none}
  .upd{font-size:12px;color:var(--sub);white-space:nowrap}
  #viewProg{overflow:visible}
  /* 進捗（OUT・IN の積み上げ） */
  #viewProg{flex:1;min-height:0;overflow:auto}
  .pg-mode{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pg-mode > button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:3px 12px;font-weight:700;color:#475569}
  .pg-mode > button.on{background:#0f766e;border-color:#0f766e;color:#fff}
  .pg-days{display:flex;gap:4px}.pg-days button{padding:3px 10px;font-size:12px;font-weight:700;border:1px solid #e5e7eb;background:#fff}.pg-days button.on{background:#111827;color:#fff;border-color:#111827}
  .pg-ban{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:6px}
  .pg-ban.live{background:#ecfdf5;color:#047857}.pg-ban.past{background:#eef2ff;color:#3730a3}.pg-ban.fut{background:#f3f4f6;color:#6b7280}
  .pg-fc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#374151;margin-bottom:8px}
  .pg-fc input{width:90px;padding:3px 6px}
  .pg-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:12px}
  .pg-pn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
  .pg-ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.pg-ph h3{margin:0;font-size:15px}
  .pg-tag{font-size:11px;font-weight:800;color:#fff;padding:1px 8px;border-radius:5px}
  .pg-kp,.pg-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .pg-sum{grid-template-columns:repeat(6,1fr)}
  .pg-k{border:1px solid #eef2f7;border-radius:8px;padding:6px 10px;background:#f9fafb;min-width:0}
  .pg-k span{font-size:11px;color:var(--sub);font-weight:600}.pg-k b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.pg-k small{font-size:11px;color:var(--sub);font-weight:700}
  .pg-src{font-weight:500 !important}
  .pg-pr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .pg-p{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
  .pg-p .n{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}.pg-p .n i{width:10px;height:10px;border-radius:3px}
  .pg-p .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pg-p .v > b{font-size:19px;font-variant-numeric:tabular-nums}.pg-p .v span{font-size:11.5px;color:var(--sub)}.pg-p .v span b{color:var(--ink)}
  .pg-j{margin-left:auto;font-size:11px;font-weight:800;padding:0 8px;border-radius:999px;white-space:nowrap}
  .pg-j.ok{background:#dcfce7;color:#15803d}.pg-j.wn{background:#fef3c7;color:#b45309}.pg-j.ng{background:#fee2e2;color:#b91c1c}
  .pg-svg{display:block;width:100%;height:auto}
  .pg-lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#4b5563}.pg-lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}.pg-lg i.bx{width:9px;height:9px;border-radius:2px}
  .pg-tw{overflow:auto;margin-top:6px}
  .pg-t{font-size:12px}.pg-t th,.pg-t td{padding:3px 6px;text-align:right}.pg-t th:first-child,.pg-t td:first-child{text-align:left}
  .pg-t td{font-variant-numeric:tabular-nums}.pg-t td small{color:#9ca3af}
  .pg-t td.uph{color:#334155;font-weight:600}.pg-t .ub{width:14%;min-width:70px;padding-left:2px;text-align:left}.pg-t td.ub i{display:block;height:9px;border-radius:2px;opacity:.75}.pg-t tr.off td.ub i{opacity:.35}.pg-t tr.tot td.uph{font-weight:800}
  .pg-t td.m{color:#b91c1c;font-weight:700}.pg-t td.pl{color:#15803d;font-weight:700}
  .pg-t tr.now td{background:#fefce8;font-weight:700}.pg-t tr.tot td{font-weight:800;border-bottom:2px solid #d1d5db;background:#f9fafb}
  .pg-ht th.g{text-align:center;border-bottom:2px solid}
  .pg-ht tr.r{cursor:pointer}.pg-ht tr.r:hover td{background:#f0fdfa}
  .pg-rate{display:inline-flex;align-items:center;gap:6px}.pg-bar{width:64px;height:7px;border-radius:4px;background:#e5e7eb;position:relative;overflow:hidden}.pg-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .pg-sh{font-size:11px;font-weight:800;padding:0 6px;border-radius:4px}.pg-sh.day{background:#dbeafe;color:#1d4ed8}.pg-sh.night{background:#1f2937;color:#fff}
  .pg-lsc{text-align:right}
  .pg-ls{display:flex;justify-content:flex-end;gap:8px;line-height:1.35;color:#b91c1c}.pg-ls span{color:#6b7280;font-size:11.5px}
  .pg-sh.all{background:#ecfdf5;color:#047857}
  .pg-ht td{vertical-align:middle}
  .pg-cut{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:12px}.pg-cut b{color:#4b5563;font-weight:700;margin-right:2px}
  .pg-cut button{padding:3px 10px;font-size:12px;font-weight:700;border:1px solid #e5e7eb;background:#fff}.pg-cut button.on{background:#0f766e;color:#fff;border-color:#0f766e}
  .pg-pb{border:1px solid #eef2f7;border-radius:8px;padding:6px 10px 4px;margin-bottom:8px;background:#fcfcfd}
  .pg-pbr{display:grid;grid-template-columns:62px 1fr 52px 120px;align-items:center;gap:8px;margin:2px 0}
  .pg-pbr .nm{font-weight:800;font-size:12.5px}.pg-pbr b{font-size:17px;text-align:right;font-variant-numeric:tabular-nums}.pg-pbr small{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
  .pg-pbr .tr{position:relative;height:12px;border-radius:6px;background:#e5e7eb}.pg-pbr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .pg-pbr .tr em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#111827;margin-left:-1px}
  .pg-pbn{font-size:10.5px;color:var(--sub);text-align:right}
  .pg-t tr.off td{color:#9ca3af}
  #pgBar button.pg-back{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:999px;padding:3px 12px;font-weight:800}
  #pgBar button.pg-imp{font-size:12px;padding:3px 10px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;font-weight:700}
  .pg-k2 .r{display:flex;align-items:baseline;gap:6px;line-height:1.25}.pg-k2 .r em{font-style:normal;font-size:11.5px;font-weight:800;width:54px}.pg-k2 .r b{font-size:17px;display:inline}.pg-k2 .r small{margin-left:auto}
  /* OUT と IN の高さをそろえる（文字の長さで行数が変わらないように） */
  .pg-kp .pg-k{height:82px;overflow:hidden}
  .pg-k > span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-k small{white-space:nowrap}
  .pg-k2 .r em{width:64px;flex:none}.pg-k2 .r b{min-width:52px;text-align:right}
  .pg-pbr .nm{white-space:nowrap}
  .pg-p .n,.pg-p .v{flex-wrap:nowrap;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-p .v span{overflow:hidden;text-overflow:ellipsis}
  .pg-k2 .r{display:grid;grid-template-columns:auto 1fr auto;gap:0 6px;align-items:baseline}.pg-k2 .r em{width:auto}.pg-k2 .r b{min-width:0;font-size:16px}.pg-k2 .r small{margin-left:0}
  .pg-pbr{grid-template-columns:62px 1fr 52px 112px 150px}.pg-pbr .uph{font-size:11.5px;color:var(--sub);white-space:nowrap}.pg-pbr .uph b{font-size:14px;color:var(--ink)}.pg-pbr .uph small{font-size:10.5px}
  .pg-lg{min-height:36px;align-content:flex-start}

</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>進捗管理</h1>
  <div class="tabs" id="shiftTabs" title="夜勤＝出勤した日の勤務（例：11/20の夜勤＝11/20 20:00〜翌8:00）"><button data-shift="all">全て</button><button data-shift="day">日勤</button><button data-shift="night">夜勤</button></div>
  <span class="dt" id="dtBox"><button id="dPrev" title="前の日">◀</button><input type="date" id="from"><button id="dNext" title="次の日">▶</button></span>
  <input type="hidden" id="to">
  <span id="pgBar" class="pg-mode"></span>
  <span class="sp"></span>
  <span class="upd" id="upd"></span><button class="sm" id="reload" title="今すぐ読み直す">更新</button>
</header>
<main><section><div id="viewProg"></div></section></main>
<script>
(() => {
  'use strict';
  // 間接打刻管理（indirect-relay-hfo1）の /api/progress を閲覧用の鍵で読む（閲覧専用）
  const PG_API = 'https://indirect-relay-hfo1.takahiro884.workers.dev', PG_KEY = '1540850d9c168e02e13c9c10c06d8bed';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 営業日（5時切替）。夜勤の 0〜5時は前日の夜勤
  const ymd = (d) => new Date(d.getTime() - 5 * 3600000 + 9 * 3600000).toISOString().slice(0, 10);
  const addDay = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  async function api(method, path) {
    const r = await fetch(PG_API + path + (path.includes('?') ? '&' : '?') + 'k=' + PG_KEY, { cache: 'no-store' });
    let j = null; try { j = await r.json(); } catch (e) { /* ignore */ }
    if (!r.ok || !j || j.ok === false) { $('dot').className = 'dot ng'; throw new Error((j && j.error) || ('HTTP ' + r.status)); }
    $('dot').className = 'dot ok';
    $('upd').textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + ' 更新';
    return j;
  }
  let shift = 'all', nightAuto = false;
  const tab = 'prog', token = true;
  try { const s = localStorage.getItem('pg_shift'); if (s === 'day' || s === 'night' || s === 'all') shift = s; } catch (e) { /* ignore */ }
  function setShift(v) {
    shift = v; try { localStorage.setItem('pg_shift', v); } catch (e) { /* ignore */ }
    document.querySelectorAll('#shiftTabs button').forEach((b) => b.classList.toggle('on', b.dataset.shift === v));
  }
  // 進捗だけのページなので、画面の切り替え＝描き直して読み込み
  function setTab() { $('dtBox').classList.toggle('off', pgMode === 'hist'); renderProg(); loadProg(); }
  const load = () => Promise.resolve(), loadTimeline = () => Promise.resolve();

  // ================= 進捗（OUT・IN の積み上げ） =================
  //  実績＝FCLM（作業変化モニター）のダイレクト作業の Unit、計画＝配置ダッシュボードの FCST を作業時間（日勤 8〜20時・夜勤 20〜5時）に均等割り
  //  日勤・夜勤の切り替えと日付は受付履歴のものを使う。「全て」は日勤＋夜勤の24時間を夜勤から累計（区切りは 0:00〜23:59 か 20:00〜19:59 を選ぶ）
  const PG_COL = { Pick: '#0891b2', Pack: '#db2777', Receive: '#ca8a04', Stow: '#16a34a' };
  const PG_GRP = { out: { cats: ['Pick', 'Pack'], name: 'アウトバウンド', tag: 'OUT', tc: '#0f766e', sub: 'Pick・Pack（少ない方＝ボトルネックで判定）' },
                   in: { cats: ['Receive', 'Stow'], name: 'インバウンド', tag: 'IN', tc: '#ca8a04', sub: 'Receive・Stow はそれぞれ FCST と比べる' } };
  let pgMode = 'day', pgData = null, pgHist = null, pgMonth = '', pgBack = null, pgImp = '', pgEdit = false, pgErr = '', pgCut = '0';
  try { pgMode = localStorage.getItem('pg_mode') === 'hist' ? 'hist' : 'day'; pgCut = localStorage.getItem('pg_cut') === '20' ? '20' : '0'; } catch (e) { /* ignore */ }
  const PG_CUT = { '0': '0:00〜23:59', '20': '20:00〜19:59' };
  // i 番目の時間帯の始まり
  const pgT = (D, i) => (D.starts ? D.starts[i] : D.start + i * 3600000);
  // 実績がある時刻まで、何時間分（表の行の数で）進んだか
  const pgUpto = (D) => (!D.dataTo ? 0 : D.hours.reduce((s, _, i) => s + Math.max(0, Math.min(1, (D.dataTo - pgT(D, i)) / 3600000)), 0));
  const pgNf = (v) => Math.round(v || 0).toLocaleString();
  const pgSg = (v) => (v >= 0 ? '+' : '−') + pgNf(Math.abs(v));
  const pgHm = (t) => { const d = new Date(t + 9 * 3600000); return d.toISOString().slice(11, 16); };
  const pgMd = (d) => { const t = new Date(d + 'T00:00:00'); return `${t.getMonth() + 1}/${t.getDate()}（${'日月火水木金土'[t.getDay()]}）`; };
  // 今のシフト（出勤日で数える：夜勤の 0:00〜8:00 は前日の夜勤）
  function pgShift() { return shift === 'day' || shift === 'night' ? shift : 'all'; }
  async function loadProg() {
    pgErr = '';
    try {
      if (pgMode === 'hist') pgHist = await api('GET', `/api/progress/hist?days=31&cut=${pgCut}${pgMonth ? '&month=' + pgMonth : ''}`);
      else pgData = await api('GET', `/api/progress?date=${$('from').value}&shift=${pgShift()}&cut=${pgCut}`);
    } catch (e) { pgErr = e.message; }
    renderProg();
  }
  // 計画：サーバーが返す1時間ごとの計画（その時間のシフトの FCST ÷ 作業時間。全ては日勤・夜勤をつないだ24時間分）を、hrs 時間目まで足す
  // 残りの作業時間（作業しない時間＝夜勤の5〜8時などは数えない）
  const pgLeft = (D, upto) => (D.plan.work || D.hours.map(() => 1)).reduce((s, w, i) => s + w * Math.max(0, Math.min(1, i + 1 - upto)), 0);
  // UPH（ダイレクト作業の Unit ÷ 時間）：進行中は直近1時間と累計、終わった日は累計
  const pgU = (o) => (o && o.h > 0.05 ? Math.round(o.u / o.h) : null);
  const pgUph = (D, c) => { const t = pgU(D.total[c]), r = pgU(D.recent[c]);
    return `<span class="uph" title="UPH＝ダイレクト作業の Unit ÷ 作業時間（FCLM）">UPH ${D.live ? `<b>${r ?? '—'}</b><small> 直近1h</small>・` : ''}<b>${t ?? '—'}</b><small> ${D.live ? '累計' : ''}</small></span>`; };
  const pgPlanTo = (arr, hrs) => { let s = 0; (arr || []).forEach((v, i) => { s += v * Math.max(0, Math.min(1, hrs - i)); }); return s; };
  function pgChart(D, g, fc) {
    const cats = PG_GRP[g].cats, nh = D.hours.length, arr = D.plan[g] || [], W = 640, H = 240, L = 42, R = 96, T = 14, B = 24, bw = (W - L - R) / nh, x = (i) => L + i * bw;
    const upto = pgUpto(D);
    const done = {}, land = {};
    cats.forEach((c) => { done[c] = D.hours.reduce((s, h) => s + h[c].u, 0); land[c] = D.live ? done[c] + (D.recent[c].u / Math.max(0.25, (D.recentTo - D.recentFrom) / 3600000)) * pgLeft(D, upto) : done[c]; });
    const top = Math.max(fc || 0, ...cats.map((c) => land[c]), 100) * 1.08;
    const step = [100, 200, 500, 1000, 1500, 2000, 2500, 5000, 10000].find((s) => top / s <= 5) || 20000, ym = Math.ceil(top / step) * step, y = (v) => T + (1 - v / ym) * (H - T - B);
    let s = '';
    for (let v = 0; v <= ym; v += step) s += `<line x1="${L}" x2="${x(nh)}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f7"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10" fill="#94a3b8" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
    for (let i = 0; i < nh; i += nh > 12 ? 2 : 1) s += `<text x="${x(i) + bw / 2}" y="${H - 7}" font-size="10" fill="#94a3b8" text-anchor="middle">${pgHm(pgT(D, i)).slice(0, 2)}</text>`;
    if (D.live) s += `<rect x="${x(upto)}" y="${T}" width="${x(nh) - x(upto)}" height="${H - T - B}" fill="#f8fafc"/>`;
    // 1時間ごとの実績（薄い棒）
    const hmax = Math.max(1, ...D.hours.flatMap((h) => cats.map((c) => h[c].u))), hy = (v) => y(0) - (v / hmax) * (H - T - B) * 0.28;
    cats.forEach((c, k) => D.hours.forEach((h, i) => { if (!h[c].u) return; s += `<rect x="${x(i) + bw * 0.16 + k * bw * 0.34}" y="${hy(h[c].u)}" width="${bw * 0.32}" height="${y(0) - hy(h[c].u)}" fill="${PG_COL[c]}" opacity=".25" rx="2"><title>${pgHm(pgT(D, i))}台 ${c} ${pgNf(h[c].u)}（${h[c].n}名）</title></rect>`; }));
    const labs = [];
    if (fc > 0) { let cp = 0; const pp = [[x(0), y(0)]]; arr.forEach((v, i) => { cp += v; pp.push([x(i + 1), y(cp)]); }); s += `<polyline points="${pp.map((q) => q.join(',')).join(' ')}" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>`; labs.push([y(fc), '#475569', `FCST ${pgNf(fc)}`]); }
    cats.forEach((c) => {
      let cc = 0; const pts = [[x(0), y(0)]];
      D.hours.forEach((h, i) => { if (i >= Math.ceil(upto)) return; cc += h[c].u; pts.push([x(Math.min(i + 1, upto)), y(cc)]); });
      if (pts.length < 2) return;
      s += `<polyline points="${pts.map((q) => q.join(',')).join(' ')}" fill="none" stroke="${PG_COL[c]}" stroke-width="2.6" stroke-linejoin="round"/>`;
      const l = pts[pts.length - 1]; s += `<circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="${PG_COL[c]}"/>`;
      if (D.live) s += `<line x1="${l[0]}" y1="${l[1]}" x2="${x(nh)}" y2="${y(land[c])}" stroke="${PG_COL[c]}" stroke-width="2" stroke-dasharray="2 4"/>`;
      labs.push([D.live ? y(land[c]) : l[1], PG_COL[c], `${c} ${pgNf(land[c])}`]);
    });
    labs.sort((a, b) => a[0] - b[0]); for (let i = 1; i < labs.length; i++) if (labs[i][0] - labs[i - 1][0] < 13) labs[i][0] = labs[i - 1][0] + 13;
    labs.forEach((l) => s += `<text x="${x(nh) + 5}" y="${l[0] + 4}" font-size="10.5" font-weight="700" fill="${l[1]}">${l[2]}</text>`);

    v.innerHTML = head + `<div class="pg-body">${pgMode === 'hist' ? pgHistHtml() : pgDayHtml()}</div>`;
    const sc = bar || v;
    sc.querySelectorAll('[data-pm]').forEach((b) => b.onclick = () => { pgBack = null; pgMode = b.dataset.pm; try { localStorage.setItem('pg_mode', pgMode); } catch (e) { /* ignore */ } setTab('prog'); });
    sc.querySelectorAll('[data-pc]').forEach((b) => b.onclick = () => { pgCut = b.dataset.pc; try { localStorage.setItem('pg_cut', pgCut); } catch (e) { /* ignore */ } pgHist = null; pgData = null; renderProg(); loadProg(); });
    sc.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => {
      if (b.dataset.back === 'hist' && pgBack) { const k = pgBack; pgBack = null; pgMode = 'hist'; nightAuto = false; $('from').value = $('to').value = k.date; setShift(k.shift); setTab('prog'); load().catch(() => {}); loadTimeline().catch(() => {}); return; }
      const k = pgBack; pgBack = null; nightAuto = false; $('from').value = $('to').value = ymd(new Date()); setShift(k ? k.shift : shift); setTab('prog'); load().catch(() => {}); loadTimeline().catch(() => {});
    });
    if ($('pgImp')) $('pgImp').onclick = async () => {
      const L = (pgHist && pgHist.daily) || [], ds = L.map((x) => x.date).sort();
      const to = ymd(new Date()), from = ds[0] || to;
      if (!confirm(`${from} 〜 ${to} の FCST をシフト表から取り込みます。すでに FCST がある日はそのままです。よろしいですか？`)) return;
      pgImp = '取込中…'; renderProg();
      try { const r = await api('POST', '/api/progress/fcstimport', { from, to }); pgImp = ''; alert(`取り込みました：${r.imported}日（すでにあった日 ${r.skipped}・シフト表に値がない日 ${r.none}・失敗 ${r.errors}）`); pgHist = null; await loadProg(); }
      catch (e) { pgImp = ''; renderProg(); alert('取り込めませんでした：' + e.message); }
    };
    if ($('pgMonth')) $('pgMonth').onchange = (e) => { pgMonth = e.target.value; pgHist = null; renderProg(); loadProg(); };
    v.querySelectorAll('tr.r[data-d]').forEach((r) => r.onclick = () => { pgBack = { date: $('from').value, shift }; pgMode = 'day'; nightAuto = false; $('from').value = $('to').value = r.dataset.d; setShift(r.dataset.s || 'all'); setTab('prog'); load().catch(() => {}); loadTimeline().catch(() => {}); });
    if ($('pgFe')) $('pgFe').onclick = () => { pgEdit = true; renderProg(); };
    if ($('pgFc')) $('pgFc').onclick = () => { pgEdit = false; renderProg(); };
    if ($('pgFs')) $('pgFs').onclick = async () => {
      try { await api('POST', '/api/progress/fcst', { date: pgData.date, shift: pgData.shift, out: $('pgFo').value, in: $('pgFi').value }); pgEdit = false; await loadProg(); }
      catch (e) { alert('保存できませんでした：' + e.message); }
    };
  }
  // 進行中は2分ごとに読み直す
  setInterval(() => { if ( !pgEdit && document.visibilityState === 'visible' && (pgMode === 'hist' || (pgData && (pgData.live || pgData.future)))) loadProg(); }, 2 * 60000);


  document.querySelectorAll('#shiftTabs button').forEach((b) => b.onclick = () => { setShift(b.dataset.shift); pgData = null; pgHist = null; setTab(); });
  $('from').value = $('to').value = ymd(new Date());
  $('from').addEventListener('change', () => { $('to').value = $('from').value; pgBack = null; pgData = null; setTab(); });
  $('dPrev').onclick = () => { $('from').value = $('to').value = addDay($('from').value, -1); pgData = null; setTab(); };
  $('dNext').onclick = () => { $('from').value = $('to').value = addDay($('from').value, 1); pgData = null; setTab(); };
  $('reload').onclick = () => loadProg();
  // 日付が変わったら（5時）今日に合わせる
  let lastToday = ymd(new Date());
  setInterval(() => { const t = ymd(new Date()); if (t !== lastToday) { if ($('from').value === lastToday) { $('from').value = $('to').value = t; pgData = null; setTab(); } lastToday = t; } }, 60000);
  setShift(shift);
  setTab();
})();
</script>
<script src="https://takahirohayashi358244.github.io/ibaraki-dockdashboad/appnav.js" data-app="prog"></script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="配置">
<title>配置ダッシュボード（スマホ）</title>
<style>
:root{
  --ink:#1f2b38; --sub:#697a8c; --line:#e3e8ee; --bg:#eef2f6;
  --accent:#2e7d5b; --alert:#e05050;
  --f0:#1f6f8b; --f1:#2e7d5b; --f2:#a07b16; --f3:#a0522d; --f4:#5b54a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.35;
  padding-bottom:calc(env(safe-area-inset-bottom) + 14px);
}
header{
  position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;
}
.h1{display:flex;align-items:center;gap:8px;}
.navbtn{all:unset;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:16px;font-weight:800;color:#fff;}
.navbtn .cr{font-size:10px;opacity:.75;}
.h1 .dot{width:9px;height:9px;border-radius:50%;background:#ff8a8a;flex:none;}
.h1 .dot.on{background:#8ce99a;}
.h1 .sp{margin-left:auto;}
.h1 .cnt{font-size:12px;opacity:.92;font-variant-numeric:tabular-nums;}
.sw{display:flex;gap:5px;margin-top:6px;}
.sw button{
  flex:none;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:7px;
  padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
}
.sw button.on{background:#fff;color:var(--accent);}
.sw .gap{flex:1;}
.wrap{padding:8px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 6px;text-align:center;}
.kpi span{display:block;font-size:10.5px;color:var(--sub);font-weight:700;}
.kpi b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;}
.kpi b small{font-size:10px;font-weight:700;color:var(--sub);margin-left:1px;}
.kpi em{display:block;font-style:normal;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;}
.kpi.all{background:#f3f8f6;border-color:#cde3d8;}
.fl{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.fl-h{
  display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;
  background:#f6f9fb;border-bottom:1px solid var(--line);
}
.fl-h .nm{font-weight:800;font-size:15px;}
.fl-h .m{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;}
.fl-h .ar{font-size:10px;color:var(--sub);transition:transform .15s;}
.fl.cl .fl-h .ar{transform:rotate(-90deg);}
.fl.cl .fl-b{display:none;}
.fl-b{padding:6px 8px 8px;}
.gr{margin-top:6px;}
.gr:first-child{margin-top:0;}
.gr-h{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--sub);margin-bottom:3px;}
.gr-h b{font-size:12.5px;color:var(--ink);}
.gr-h .n{margin-left:auto;font-variant-numeric:tabular-nums;}
.gr-h .tp{font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;}
.gr-h .tp b{font-size:11.5px;}
.kpi em.tp{color:var(--ink);font-weight:700;font-size:10.5px;}
.ch i.u{background:#fff;border-radius:6px;padding:0 4px;opacity:1;font-weight:800;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.ch{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;
  font-size:12px;font-weight:700;background:#64748b;color:#fff;max-width:100%;
}
.ch i{font-style:normal;font-size:9.5px;opacity:.85;font-variant-numeric:tabular-nums;}
.empty{color:var(--sub);font-size:11.5px;padding:6px 2px;}
.nw .ch{background:#94a3b8;}
.ft{color:var(--sub);font-size:10.5px;text-align:center;padding:6px;}
.navmenu{
  position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 42px);z-index:60;min-width:200px;
  background:#fff;border:1px solid #d8e0e8;border-radius:12px;box-shadow:0 12px 34px rgba(20,35,50,.32);padding:5px;
}
.navmenu[hidden]{display:none;}
.navmenu a{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;color:#1f2b38;text-decoration:none;font-size:14px;font-weight:700;}
.navmenu a .mk{width:7px;height:7px;border-radius:50%;background:transparent;flex:none;}
.navmenu a.cur{color:#1f6f8b;} .navmenu a.cur .mk{background:#1f6f8b;}
.navmask{position:fixed;inset:0;z-index:55;} .navmask[hidden]{display:none;}
</style>
</head>
<body data-app="haichi">
<header>
  <div class="h1"><button class="navbtn" id="navBtn">配置<span class="cr">▼</span></button>
    <span class="cnt" id="cnt">—</span><span class="sp"></span><span class="dot" id="dot"></span></div>
  <div class="sw" id="sw"></div>
</header>
<div class="navmask" id="navMask" hidden></div>
<div class="navmenu" id="navMenu" hidden></div>
<div class="wrap"><div class="kpis" id="kpis"></div><div id="body"><div class="empty">読み込み中…</div></div></div>
<div class="ft">閲覧専用です。配置の変更はPCの配置ダッシュボードから行ってください。</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== 配置ダッシュボードのスマホ用（閲覧専用。PC版と同じデータを読むだけ） ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD01thIqlq4VQpSe8fxU-0a_M9ynO6p0IM",
  authDomain: "gworker-haichi.firebaseapp.com",
  databaseURL: "https://gworker-haichi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gworker-haichi",
  storageBucket: "gworker-haichi.firebasestorage.app",
  messagingSenderId: "218653712277",
  appId: "1:218653712277:web:af850c4143bbf88983209c"
};
const PLACES = ["OUT", "IN", "ICQA", "other"];
const NONWORK = [["WAIT", "待機"], ["ABSENT", "欠勤"], ["HOLIDAY", "休日"]];
const ROLE_STYLES = {
  Manager: "#059669", Supervisor: "#d97706", Reader: "#2563eb",
  Operator: "#64748b", Observer: "#7c3aed", Gworker: "#111827",
};
const ROLE_ORDER = { Supervisor: 0, Manager: 1, Reader: 2, Operator: 3, Observer: 4 };

let roster = [], custom = {}, admins = {}, layout = {}, floorMove = {}, nameOverride = {};
let master = { OUT: [], IN: [], ICQA: [] }, floors = ["6F", "5F", "4F", "3F", "2F"];
let shift = "日勤";
const closed = {};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const uid = p => p.no + "_" + p.name;
const uidEnc = u => String(u).replace(/[.#$\[\]\/]/g, "_");
const fmt1 = n => (Math.round(n * 10) / 10).toString().replace(/\.0$/, "");
function people() {
  const list = Array.isArray(roster) ? roster.filter(Boolean).slice() : [];
  Object.values(custom || {}).forEach(c => { if (c && !list.some(p => p.no === c.no)) list.push(c); });
  return list;
}
const masterOk = () => ["OUT", "IN", "ICQA"].some(k => Array.isArray(master[k]) && master[k].length);
function locOf(p) {
  const k = uidEnc(uid(p)), L = layout[k];
  const valid = (pl, sub) => !masterOk() || (Array.isArray(master[pl]) && master[pl].includes(sub));
  if (L !== undefined && L !== null) {
    if (["WAIT", "ABSENT", "HOLIDAY", "other"].includes(L)) return L;
    const pt = String(L).split("|");
    if (pt.length >= 2 && valid(pt[0], pt[1])) return pt[0] + "|" + pt[1];   // Pickゾーンは親工程にまとめる
    return "WAIT";
  }
  return valid(p.section, p.subsec) ? p.section + "|" + p.subsec : "WAIT";
}
const floorOf = p => (floorMove[uidEnc(uid(p))] !== undefined ? floorMove[uidEnc(uid(p))] : p.floor);
const dispName = p => { const v = nameOverride[uidEnc(uid(p))]; return (v !== undefined && v !== "") ? v : p.name; };
/* ===== 個人の過去30日UPH（間接打刻管理・FCLM）── PC版の配置ダッシュボードと同じ計算 =====
   工程の右に UPH・TP（＝Σ 各人のUPH×LH）。実績がない人は工程の全体平均で見込む。
   OUT は Pick・Pack の少ない方（ボトルネック）、IN は Receive・Stow を別々に（IN の Fork は Stow） */
const MU_API = "https://indirect-relay-hfo1.takahiro884.workers.dev/api/fr/uphall?days=30&k=1540850d9c168e02e13c9c10c06d8bed";
const MU_COL = { Pick: "#0891b2", Pack: "#db2777", Receive: "#ca8a04", Stow: "#16a34a" };
const MU = { by: new Map(), people: [], fb: {}, ok: false, cache: new Map() };
const MU_IT = {"髙":"高","﨑":"崎","嵜":"崎","德":"徳","濵":"浜","濱":"浜","邊":"辺","邉":"辺","齋":"斎","齊":"斎","槇":"槙","冨":"富","櫻":"桜","澤":"沢","國":"国","廣":"広","眞":"真","實":"実","惠":"恵","瀨":"瀬"};
const muNorm = s => String(s || "").normalize("NFKC").replace(/[髙﨑嵜德濵濱邊邉齋齊槇冨櫻澤國廣眞實惠瀨]/g, c => MU_IT[c] || c).replace(/[\s　・.,，]/g, "").toLowerCase();
const muCo = s => String(s || "").normalize("NFKC").replace(/\s/g, "").toLowerCase();
function muLoad() {
  fetch(MU_API, { cache: "no-store" }).then(r => r.json()).then(j => {
    if (!j || !j.ok) return;
    const m = new Map(), dup = new Set();
    for (const q of j.people || []) for (const n of [q.name, q.alias]) { const k = muNorm(n); if (!k) continue; if (m.has(k) && m.get(k) !== q.cats) dup.add(k); m.set(k, q.cats); }
    dup.forEach(k => m.delete(k));
    MU.by = m; MU.people = j.people || []; MU.cache = new Map(); MU.ok = true;
    for (const k of Object.keys(MU_COL)) { let u = 0, h = 0; for (const q of MU.people) { const c = q.cats && q.cats[k]; if (c && c.uph != null) { u += c.uph * c.hrs; h += c.hrs; } } MU.fb[k] = h > 0 ? u / h : null; }
    render();
  }).catch(e => console.warn("個人UPHの読込に失敗", e));
}
setTimeout(muLoad, 1200); setInterval(muLoad, 30 * 60000);
function muCats(p) {
  const dn = dispName(p), key = dn + "|" + p.name + "|" + p.role;
  if (MU.cache.has(key)) return MU.cache.get(key);
  let c = MU.by.get(muNorm(dn)) || MU.by.get(muNorm(p.name)) || null;
  if (!c) {   // 外国籍の方：シフト表がフルネーム、打刻監視が呼び名のとき（同じ会社で「・」区切りの最後が一致する1人）
    const co = muCo(p.role), segs = [dn, p.name].map(n => String(n || "").normalize("NFKC").split(/[・･\s　]+/).filter(Boolean)).filter(a => a.length > 1).map(a => muNorm(a[a.length - 1]));
    if (segs.length && co) { const hit = MU.people.filter(q => { const qc = muCo(q.company); return qc && (qc.startsWith(co) || co.startsWith(qc)) && segs.includes(muNorm(q.name)); }); if (hit.length === 1) c = hit[0].cats; }
  }
  MU.cache.set(key, c);
  return c;
}
function muSecCat(sub, pl) { const s = String(sub || ""); if (pl === "ICQA") return null; if (pl === "IN" && /fork/i.test(s)) return "Stow"; return /stow/i.test(s) ? "Stow" : /pick/i.test(s) ? "Pick" : /pack/i.test(s) ? "Pack" : /receiv|recive|rcv|decant|prep/i.test(s) ? "Receive" : null; }
function muLocCat(p) { const l = locOf(p); if (!l.includes("|")) return null; const a = l.split("|"); return muSecCat(a[1], a[0]); }
function muUph(p, cat) { const c = muCats(p); return c && c[cat] ? c[cat].uph : null; }
function muCap(ps, cat) {
  const o = { lh: 0, tp: 0, uph: null };
  for (const p of ps) { const lh = p.lh || 0; o.lh += lh; const u = muUph(p, cat) ?? MU.fb[cat]; if (u != null) o.tp += u * lh; }
  o.uph = o.lh > 0 && o.tp > 0 ? o.tp / o.lh : null;
  return o;
}
const muN = n => Math.round(n).toLocaleString("ja-JP");
function muGrp(g) {
  if (!MU.ok || !g.cat) return "";
  const c = muCap(g.list, g.cat);
  return `<span class="tp" style="color:${MU_COL[g.cat]}">UPH <b>${c.uph != null ? Math.round(c.uph) : "—"}</b> TP <b>${muN(c.tp)}</b></span>`;
}
// 上のタイル：OUT は Pick・Pack の少ない方、IN は Receive・Stow それぞれ
function muIO(list, io) {
  if (!MU.ok) return "";
  const cats = io === "OUT" ? ["Pick", "Pack"] : ["Receive", "Stow"], r = {};
  cats.forEach(k => { const m = list.filter(p => muLocCat(p) === k); if (m.length) r[k] = muCap(m, k); });
  const ks = Object.keys(r); if (!ks.length) return "";
  if (io === "OUT") { const lo = ks.reduce((a, k) => (a == null || r[k].tp < r[a].tp ? k : a), null); return `<em class="tp">TP ${muN(r[lo].tp)}</em>`; }
  return `<em class="tp">${ks.map(k => `${k[0]} ${muN(r[k].tp)}`).join(" / ")}</em>`;
}
const roleColor = r => ROLE_STYLES[r] || "#0891b2";
const sortP = (a, b) => (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) || (a.no - b.no);

function shifts() {
  const s = new Set();
  people().forEach(p => { if (p.shift) s.add(p.shift); });
  const base = ["日勤", "夜勤"].filter(x => s.has(x));
  [...s].forEach(x => { if (!base.includes(x)) base.push(x); });
  return base.length ? base : ["日勤"];
}
function chip(p, cat) {
  const u = cat && MU.ok ? muUph(p, cat) : null;   // 配置先の工程の UPH（実績がある人だけ）
  return `<span class="ch" style="background:${roleColor(p.role)}">${esc(dispName(p))}<i>${fmt1(p.lh || 0)}</i>${u != null ? `<i class="u" style="color:${MU_COL[cat]}">${u}</i>` : ""}</span>`;
}
function render() {
  const sh = shifts();
  if (!sh.includes(shift)) shift = sh[0];
  document.getElementById("sw").innerHTML =
    sh.map(x => `<button class="${x === shift ? "on" : ""}" onclick="setShift('${esc(x)}')">${esc(x)}</button>`).join("") + '<span class="gap"></span>';

  const all = people().filter(p => p.shift === shift);
  const work = all.filter(p => !["WAIT", "ABSENT", "HOLIDAY"].includes(locOf(p)));
  document.getElementById("cnt").textContent = `稼働 ${work.length}名 / 全${all.length}名`;

  // 上段：全体と工程別（OUT / IN / ICQA）
  const sum = list => ({ hc: list.length, lh: list.reduce((s, p) => s + (p.lh || 0), 0) });
  const byPlace = pl => sum(work.filter(p => locOf(p).split("|")[0] === pl));
  const tile = (label, v, cls, extra) => `<div class="kpi ${cls || ""}"><span>${label}</span><b>${v.hc}<small>名</small></b><em>LH ${fmt1(v.lh)}</em>${extra || ""}</div>`;
  const icqa = byPlace("ICQA");
  const inPl = pl => work.filter(p => locOf(p).split("|")[0] === pl);
  document.getElementById("kpis").innerHTML =
    tile("稼働", sum(work), "all") + tile("OUT", byPlace("OUT"), "", muIO(inPl("OUT"), "OUT")) + tile("IN", byPlace("IN"), "", muIO(inPl("IN"), "IN")) + tile("ICQA", icqa);

  let h = "";
  floors.forEach((fn, i) => {
    const mem = all.filter(p => floorOf(p) === fn && !["WAIT", "ABSENT", "HOLIDAY"].includes(locOf(p)));
    const lh = mem.reduce((s, p) => s + (p.lh || 0), 0);
    const col = `var(--f${i % 5})`;
    // 工程ごとにまとめる
    const groups = [];
    PLACES.forEach(pl => {
      if (pl === "other") {
        const g = mem.filter(p => locOf(p) === "other");
        if (g.length) groups.push({ label: "その他", sub: "", list: g });
        return;
      }
      (master[pl] || []).forEach(sub => {
        const g = mem.filter(p => locOf(p) === pl + "|" + sub);
        if (g.length) groups.push({ label: pl, sub, list: g, cat: muSecCat(sub, pl) });
      });
    });
    h += `<div class="fl${closed[fn] ? " cl" : ""}" data-f="${esc(fn)}">
      <div class="fl-h" onclick="toggleFloor('${esc(fn)}')">
        <span class="ar">▼</span><span class="nm" style="color:${col}">${esc(fn)}</span>
        <span class="m">${mem.length}名 ・ LH ${fmt1(lh)}</span></div>
      <div class="fl-b">${groups.length ? groups.map(g => `
        <div class="gr"><div class="gr-h"><b>${esc(g.sub || g.label)}</b>${g.sub ? `<span>${esc(g.label)}</span>` : ""}
          <span class="n">${g.list.length}名 ・ ${fmt1(g.list.reduce((s, p) => s + (p.lh || 0), 0))}</span>${muGrp(g)}</div>
          <div class="chips">${g.list.slice().sort(sortP).map(p => chip(p, g.cat)).join("")}</div></div>`).join("")
        : `<div class="empty">配置なし</div>`}</div>
    </div>`;
  });
  // 非稼働
  const nw = NONWORK.map(([loc, label]) => ({ label, list: all.filter(p => locOf(p) === loc) })).filter(x => x.list.length);
  if (nw.length) {
    h += `<div class="fl nw${closed["_nw"] ? " cl" : ""}">
      <div class="fl-h" onclick="toggleFloor('_nw')"><span class="ar">▼</span><span class="nm" style="color:var(--sub)">待機・欠勤・休日</span>
        <span class="m">${nw.reduce((s, x) => s + x.list.length, 0)}名</span></div>
      <div class="fl-b">${nw.map(x => `<div class="gr"><div class="gr-h"><b>${esc(x.label)}</b><span class="n">${x.list.length}名</span></div>
        <div class="chips">${x.list.slice().sort(sortP).map(p => chip(p)).join("")}</div></div>`).join("")}</div></div>`;
  }
  document.getElementById("body").innerHTML = h || `<div class="empty">データがありません</div>`;
}
function setShift(s) { shift = s; render(); }
function toggleFloor(f) { closed[f] = !closed[f]; render(); }

/* ===== Firebase（読むだけ） ===== */
function start() {
  const db = firebase.database();
  db.ref(".info/connected").on("value", s => document.getElementById("dot").classList.toggle("on", s.val() === true));
  const on = (path, fn) => db.ref(path).on("value", s => { fn(s.val()); render(); });
  on("roster", v => { roster = Array.isArray(v) ? v : (v ? Object.values(v) : []); });
  on("custom", v => { custom = v || {}; });
  on("layout", v => { layout = v || {}; });
  on("floorMove", v => { floorMove = v || {}; });
  on("nameOverride", v => { nameOverride = v || {}; });
  on("master", v => { master = v || { OUT: [], IN: [], ICQA: [] }; });
  on("floors", v => { if (Array.isArray(v) && v.length) floors = v.filter(Boolean); });
}
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(u => { if (u) start(); });
  firebase.auth().signInAnonymously().catch(() => {
    document.getElementById("body").innerHTML = '<div class="empty">接続できませんでした</div>';
  });
} catch (e) { /* 無視 */ }

/* ===== ページ切替（PC版と同じ考え方） ===== */
(function () {
  const APPS = [
    { id: "dock", name: "ドック状況", url: "m.html" },
    { id: "plan", name: "着車プラン", url: "plan-m.html" },
    { id: "haichi", name: "配置", url: "haichi-m.html" },
  ];
  const cur = document.body.dataset.app || "";
  const btn = document.getElementById("navBtn"), menu = document.getElementById("navMenu"), mask = document.getElementById("navMask");
  if (!btn || !menu) return;
  menu.innerHTML = APPS.map(a => a.id === cur
    ? `<a class="cur" href="#" onclick="return false"><span class="mk"></span>${a.name}</a>`
    : `<a href="${a.url}" data-url="${a.url}"><span class="mk"></span>${a.name}</a>`).join("");
  // ホーム画面から開いた（スタンドアロン）ときにSafariの枠が出ないよう、リンクは同じ画面で移動させる
  menu.querySelectorAll("a[data-url]").forEach(el => el.addEventListener("click", e => {
    e.preventDefault();
    location.assign(el.dataset.url);
  }));
  const close = () => { menu.hidden = true; mask.hidden = true; };
  btn.addEventListener("click", e => { e.stopPropagation(); const o = menu.hidden; menu.hidden = !o; mask.hidden = !o; });
  mask.addEventListener("click", close);
})();
</script>
</body>
</html>

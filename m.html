<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HFO1">
<link rel="manifest" href="app.webmanifest">
<title>HFO1 現場ビュー</title>
<style>
:root{
  --ink:#1f2b38; --sub:#697a8c; --line:#e3e8ee; --bg:#eef2f6; --panel:#fff;
  --accent:#1f6f8b; --green:#2e7d32; --warn:#e0a030; --alert:#e05050;
  --f0:#1f6f8b; --f1:#2e7d5b; --f2:#a07b16; --f3:#a0522d; --f4:#5b54a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;height:100%;overflow:hidden;
}
header{
  flex:none;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;transition:background .15s;
}
body[data-v="plan"] header{background:#24506a;}
body[data-v="haichi"] header{background:#2e7d5b;}
body[data-v="att"] header{background:#111;}
.h1{display:flex;align-items:center;gap:8px;}
.navbtn{all:unset;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:16px;font-weight:800;color:#fff;}
.navbtn .cr{font-size:10px;opacity:.75;}
.h1 .sub{font-size:12.5px;opacity:.92;font-variant-numeric:tabular-nums;}
.h1 .sp{margin-left:auto;}
.h1 .dot{width:9px;height:9px;border-radius:50%;background:#ff8a8a;flex:none;}
.h1 .dot.on{background:#8ce99a;}
.h1 .dot.mst{margin-left:6px;} .h1 .dot.mst.on{background:#4aa3ff;}
.sw{display:flex;gap:5px;margin-top:6px;}
.sw button{flex:none;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:7px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.sw button.on{background:#fff;color:#2e7d5b;}
.view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;}
.view[hidden]{display:none;}
.wrap{padding:8px 8px 20px;}
.empty{color:var(--sub);font-size:11.5px;text-align:center;padding:14px 4px;}
.ft{color:var(--sub);font-size:10.5px;text-align:center;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);}

/* --- 切替メニュー --- */
.navmenu{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 42px);z-index:60;min-width:210px;
  background:#fff;border:1px solid #d8e0e8;border-radius:12px;box-shadow:0 12px 34px rgba(20,35,50,.32);padding:5px;}
.navmenu[hidden]{display:none;}
.navmenu button{all:unset;display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;
  color:#1f2b38;font-size:14px;font-weight:700;cursor:pointer;width:100%;box-sizing:border-box;}
.navmenu button .mk{width:7px;height:7px;border-radius:50%;background:transparent;flex:none;}
.navmenu button.cur{color:var(--accent);} .navmenu button.cur .mk{background:var(--accent);}
.navmask{position:fixed;inset:0;z-index:55;} .navmask[hidden]{display:none;}

/* --- ドック状況（3列） --- */
.cols{display:flex;gap:5px;padding:5px;height:100%;}
.col{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;}
.col-h{flex:none;padding:6px 4px 5px;text-align:center;font-weight:800;font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;}
.col-h b{font-size:15px;font-variant-numeric:tabular-nums;}
.col.plan .col-h{background:#4a7f99;} .col.arrive .col-h{background:var(--green);} .col.done .col-h{background:#8a97a3;}
.col-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:5px;display:flex;flex-direction:column;gap:5px;}
.col-b::-webkit-scrollbar{width:0;}
.c{background:#fff;border:1px solid var(--line);border-left:3px solid var(--sub);border-radius:8px;padding:5px 6px 6px;cursor:pointer;box-shadow:0 1px 2px rgba(40,60,80,.08);}
.c:active{background:#f3f7f9;}
.c .t1{display:flex;align-items:center;gap:4px;}
.c .tm{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;}
.c .u{margin-left:auto;font-weight:700;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
.c .cr{font-size:11.5px;font-weight:700;line-height:1.25;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c .id{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.c.plan{border-left-color:#4a7f99;} .c.arrive{border-left-color:var(--green);} .c.done{border-left-color:#9aa8b8;}
.c.late{border-left-color:var(--alert);background:#fff5f5;}
.c.abs{background:#f4f6f8;opacity:.72;} .c.abs .cr,.c.abs .tm{text-decoration:line-through;color:#8a97a3;}
.bayb{display:inline-block;background:var(--green);color:#fff;font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums;}
.el{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:1px;}
.el.warn{color:#b3790c;font-weight:700;} .el.alert{color:var(--alert);font-weight:800;}
.tag{display:inline-block;font-size:9.5px;font-weight:800;border-radius:4px;padding:0 5px;margin-top:2px;background:#eef2f5;color:#5c6b79;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag.abs{background:#b71c1c;color:#fff;} .tag.idx{background:#0277bd;color:#fff;} .tag.idx.ok{background:var(--green);}

/* --- 着車プラン --- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 9px 9px;}
.kpi span{display:block;font-size:11px;color:var(--sub);line-height:1.3;}
.kpi b{font-size:21px;line-height:1.3;font-variant-numeric:tabular-nums;}
.kpi.alert b{color:var(--alert);}
.sec{font-weight:800;font-size:11.5px;color:var(--sub);margin:9px 3px 5px;}
.fl{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sub);border-radius:10px;padding:5px 9px 6px;margin-bottom:5px;}
.fl .r1{display:flex;align-items:baseline;gap:8px;}
.fl .nm{font-weight:800;font-size:15px;}
.fl .n{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;}
.fl .n small{font-weight:600;color:var(--sub);font-size:11px;}
.fl .u{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;}
.fl .r2{display:flex;gap:8px;margin-top:1px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;flex-wrap:wrap;}
.fl .r2 b{color:var(--ink);font-size:12px;}
.bar{height:5px;border-radius:3px;background:#eceff2;margin-top:4px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--green);}
.bar i.warn{background:var(--warn);} .bar i.alert{background:var(--alert);}
.st{display:flex;gap:6px;margin-bottom:8px;}
.st div{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;}
.st b{display:block;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;}
.st span{font-size:10px;color:var(--sub);}
.st .ok b{color:var(--green);} .st .run b{color:#0277bd;} .st .wait b{color:#b3790c;} .st .ng b{color:var(--alert);}
.st .ng.has{cursor:pointer;border-color:#f0b4b4;background:#fff7f7;}
.ngrow{background:#fff;border:1px solid #f0c9c9;border-left:4px solid var(--alert);border-radius:9px;padding:6px 9px;margin-bottom:6px;font-size:11.5px;}
.ngrow b{font-size:12.5px;font-variant-numeric:tabular-nums;}
.ngrow div{color:var(--sub);margin-top:1px;}

/* --- 配置 --- */
.kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;}
.kpi4{background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 6px;text-align:center;}
.kpi4 span{display:block;font-size:10.5px;color:var(--sub);font-weight:700;}
.kpi4 b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;}
.kpi4 b small{font-size:10px;font-weight:700;color:var(--sub);margin-left:1px;}
.kpi4 em{display:block;font-style:normal;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;}
.kpi4.all{background:#f3f8f6;border-color:#cde3d8;}
.hf{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.hf-h{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;background:#f6f9fb;border-bottom:1px solid var(--line);}
.hf-h .nm{font-weight:800;font-size:15px;}
.hf-h .m{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;}
.hf-h .ar{font-size:10px;color:var(--sub);transition:transform .15s;}
.hf.cl .hf-h .ar{transform:rotate(-90deg);} .hf.cl .hf-b{display:none;}
.hf-b{padding:6px 8px 8px;}
.gr{margin-top:6px;} .gr:first-child{margin-top:0;}
.gr-h{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--sub);margin-bottom:3px;}
.gr-h b{font-size:12.5px;color:var(--ink);}
.gr-h .n{margin-left:auto;font-variant-numeric:tabular-nums;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
/* PC版（全フロア表示）と同じ丸バッジ */
.ch{
  all:unset;box-sizing:border-box;width:28px;height:28px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;position:relative;
  font-size:13px;font-weight:800;cursor:pointer;
  border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.ch:active{transform:scale(1.12);}
.ch.adm{box-shadow:0 0 0 2px #fbbf24,0 1px 3px rgba(0,0,0,.18);border-color:#fbbf24;}
.ch.night::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#1e293b;border:1.5px solid #fff;}
.ch .fk{position:absolute;left:-3px;top:-3px;background:#0ea5e9;color:#fff;font-size:8px;line-height:1;
  padding:2px 3px;border-radius:4px;border:1px solid #fff;font-weight:800;}
#pop{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:70;
  background:#1e293b;color:#fff;border-radius:10px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-width:92vw;text-align:center;
}
#pop[hidden]{display:none;}
#pop b{display:block;font-size:14px;}
#pop span{font-size:11.5px;opacity:.85;}

/* --- 詳細シート --- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;
  box-shadow:0 -10px 40px rgba(20,35,50,.35);padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(102%);transition:transform .22s ease-out;max-height:80%;overflow:auto;}
.sheet.show{transform:translateY(0);}
.mask{position:fixed;inset:0;background:rgba(20,35,50,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;}
.mask.show{opacity:1;pointer-events:auto;}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:#ccd5dc;margin:0 auto 10px;}
.sheet h2{margin:0 0 2px;font-size:16px;}
.sheet .sid{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;margin-bottom:10px;}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;}
.sheet dt{color:var(--sub);white-space:nowrap;}
.sheet dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.sheet .cl{margin-top:14px;width:100%;padding:11px;border:0;border-radius:10px;background:#eef2f5;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;}

/* --- 出勤者（無線管理システムの出勤者一覧） --- */
#v-att .wrap{padding-top:0;}
.at-bar{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 6px;margin:0 -8px 0;padding-left:8px;padding-right:8px;border-bottom:1px solid var(--line);}
.at-srch{display:flex;gap:6px;}
.at-srch input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;outline:none;font-family:inherit;}
.at-srch input:focus{border-color:#1f3864;box-shadow:0 0 0 3px rgba(31,56,100,.12);}
.at-srch button{flex:none;font:inherit;font-size:13px;padding:0 11px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;color:#374151;}
.at-chips{display:flex;gap:6px;margin-top:7px;align-items:center;}
.at-chips button{font:inherit;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid #cfd6e0;background:#fff;color:#4b5563;}
.at-chips button.on{background:#1f3864;border-color:#1f3864;color:#fff;}
.at-chips .cnt{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap;}
.at-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0 4px;}
.at-sum div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 2px;text-align:center;}
.at-sum span{display:block;font-size:10px;color:var(--sub);font-weight:700;}
.at-sum b{font-size:16px;font-variant-numeric:tabular-nums;}
.at-leg{font-size:10.5px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap;margin:2px 3px 6px;}
.at-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-2px;margin-right:3px;background:#fff3cd;border:1px solid #f0d98a;}
.at-tb{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:10px;table-layout:fixed;}
.at-tb th{position:sticky;top:var(--atBarH,78px);z-index:3;background:#eef1f6;color:#4b5563;font-size:11px;font-weight:700;padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;}
.at-tb th.l{text-align:left;padding-left:8px;} .at-tb th.cid{width:28%;} .at-tb th.cdv{width:15%;font-size:10.5px;letter-spacing:-.3px;}
.at-tb td{padding:7px 3px;border-bottom:1px solid #eef0f4;font-size:13px;vertical-align:middle;}
.at-tb tr:last-child td{border-bottom:0;}
.at-tb td.id{padding-left:8px;font-variant-numeric:tabular-nums;word-break:break-all;}
.at-tb td.id .al{display:block;font-size:11px;color:#2563eb;margin-top:1px;font-weight:700;}
.at-tb td.nm{word-break:break-all;} .at-tb td.nm .n{font-weight:700;}
.at-tb td.nm.lent .n{background:#fff3cd;color:#7a5a00;border-radius:4px;padding:0 4px;box-shadow:inset 0 0 0 1px #f0d98a;}
.at-tb td.nm small{display:block;font-size:10.5px;color:var(--sub);margin-top:1px;}
.at-tb td.dv{text-align:center;} .at-tb td.dv b{display:block;font-size:16px;line-height:1.05;color:#1f7a5a;}
.at-tb td.dv small{display:block;font-size:10px;color:#374151;font-weight:700;font-variant-numeric:tabular-nums;}
.at-tb tr.off td{color:#9ca3af;background:#fafafa;} .at-tb tr.off td.nm.lent .n{opacity:.7;}
.at-tb mark{background:#dbeafe;color:inherit;border-radius:2px;padding:0 1px;}
.at-orph{display:flex;flex-wrap:wrap;gap:5px;}
.at-orph span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;}
.at-orph span b{color:#1f7a5a;margin-right:4px;}
/* --- 出勤者の履歴（日付で見る・人で探す） --- */
.ath-seg{display:flex;background:#fff;border:1px solid #e3e8ee;border-radius:10px;overflow:hidden;margin-bottom:7px;}
.ath-seg button{flex:1;border:0;background:transparent;padding:8px 0;font:inherit;font-weight:800;font-size:13.5px;color:#697a8c;}
.ath-seg button.on{background:#1f3864;color:#fff;}
.ath-nav{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.ath-nav button{flex:none;width:40px;height:36px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;font-size:18px;color:#374151;font-family:inherit;}
.ath-nav button:disabled{opacity:.35;}
.ath-nav .ath-today{width:auto;padding:0 9px;font-size:12.5px;font-weight:700;color:#1f3864;white-space:nowrap;}
.ath-d{position:relative;flex:1;min-width:0;height:36px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;}
.ath-d small{font-weight:600;color:#697a8c;font-size:11px;}
.ath-d input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;}
.ath-past{background:#fff4e0;border:1px solid #f0cf8f;color:#7a4d00;border-radius:8px;padding:5px 9px;font-size:11.5px;margin-bottom:6px;}
.ath-srch input{width:100%;font-size:16px;padding:8px 10px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;outline:none;font-family:inherit;box-sizing:border-box;}
.ath-srch input:focus{border-color:#1f3864;box-shadow:0 0 0 3px rgba(31,56,100,.12);}
.ath-per{display:flex;gap:5px;margin:7px 0 8px;}
.ath-per button{flex:1;font:inherit;font-size:12.5px;font-weight:700;padding:5px 0;border-radius:999px;border:1px solid #cfd6e0;background:#fff;color:#4b5563;}
.ath-per button.on{background:#1f3864;border-color:#1f3864;color:#fff;}
.ath-hint{font-size:12px;color:#697a8c;text-align:center;padding:18px 6px;}
.ath-err{margin:6px 0;padding:7px 9px;border-radius:8px;background:#fde8e8;color:#991b1b;font-size:12px;}
.ath-cand{background:#fff;border:1px solid #e3e8ee;border-radius:10px;margin-bottom:8px;overflow:hidden;}
.ath-cand .h{font-size:11.5px;color:#697a8c;font-weight:700;padding:7px 10px 3px;}
.ath-cand button{all:unset;display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;padding:9px 10px;border-top:1px solid #eef0f4;cursor:pointer;}
.ath-cand button.on{background:#eef4ff;}
.ath-cand .nm{font-weight:800;} .ath-cand .id{font-size:12px;color:#697a8c;} .ath-cand .al{font-size:12px;color:#2563eb;font-weight:700;}
.ath-cand .ath-c{margin-left:auto;font-size:12px;color:#697a8c;white-space:nowrap;}
.ath-cand .nm.lent,.ath-pcard .lent{background:#fff3cd;color:#7a5a00;border-radius:4px;padding:0 4px;box-shadow:inset 0 0 0 1px #f0d98a;}
.ath-pcard{background:#fff;border:1px solid #e3e8ee;border-left:5px solid #1f3864;border-radius:10px;padding:9px 11px;margin-bottom:8px;}
.ath-pcard .nm{font-size:17px;font-weight:800;} .ath-pcard .meta{font-size:12px;color:#697a8c;margin-top:2px;}
.ath-pcard .meta .al{color:#2563eb;font-weight:700;}
.ath-pcard .kp{display:flex;gap:6px;margin-top:8px;}
.ath-pcard .kp div{flex:1;background:#f4f6f9;border-radius:8px;padding:5px 4px;text-align:center;}
.ath-pcard .kp span{display:block;font-size:10px;color:#697a8c;font-weight:700;} .ath-pcard .kp b{font-size:17px;}
.ath-day{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;}
.ath-day .dt{flex:none;width:54px;text-align:center;}
.ath-day .dt b{display:block;font-size:17px;line-height:1.1;} .ath-day .dt span{font-size:10.5px;color:#697a8c;}
.ath-day .dt.sat span{color:#2563eb;} .ath-day .dt.sun span{color:#dc2626;}
.ath-day .bd{flex:1;min-width:0;}
.ath-day .tm{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.ath-day .tm .dur{font-weight:600;color:#697a8c;font-size:12px;margin-left:4px;}
.ath-day .tm .nr{color:#b45309;font-weight:700;font-size:11.5px;margin-left:4px;}
.ath-day .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.ath-chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#e8f5ee;color:#1f7a5a;border:1px solid #bfe3cf;}

<body data-v="dock">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ==========================================================
   HFO1 現場ビュー（スマホ用・閲覧専用）
   ドック状況／着車プラン／配置 を1ページにまとめ、
   Firebaseの接続と購読は1回だけ。表示はJavaScriptで切り替える。
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD01thIqlq4VQpSe8fxU-0a_M9ynO6p0IM",
  authDomain: "gworker-haichi.firebaseapp.com",
  databaseURL: "https://gworker-haichi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gworker-haichi",
  storageBucket: "gworker-haichi.firebasestorage.app",
  messagingSenderId: "218653712277",
  appId: "1:218653712277:web:af850c4143bbf88983209c"
};
const DOCK_ROOT = "dock", ID_FIELD = "Appointment Id";
const BREAK_DEFAULT = "12:00-12:45,15:00-15:15";
const DOOR_TTL = 3 * 3600000, DOORSTATE_TTL = 7 * 24 * 3600000;
const PLACES = ["OUT", "IN", "ICQA", "other"];
const NONWORK = [["WAIT", "待機"], ["ABSENT", "欠勤"], ["HOLIDAY", "休日"]];
// PC版（配置ダッシュボード）と同じ配色
const ROLE_STYLES = {
  Manager: { bg: "#059669", fg: "#fff" }, Supervisor: { bg: "#d97706", fg: "#fff" },
  Reader: { bg: "#2563eb", fg: "#fff" }, Operator: { bg: "#64748b", fg: "#fff" },
  Observer: { bg: "#7c3aed", fg: "#fff" }, Gworker: { bg: "#000000", fg: "#facc15" },
};
const ROLE_AUTO_COLORS = ["#0891b2", "#db2777", "#16a34a", "#ea580c", "#9333ea", "#dc2626", "#0d9488", "#c026d3", "#65a30d", "#1d4ed8", "#b45309", "#7e22ce"];
const _roleAuto = new Map();
let _roleAutoVer = -1;
const ROLE_ORDER = { Supervisor: 0, Manager: 1, Reader: 2, Operator: 3, Observer: 4 };

/* ---------- 共有データ ---------- */
const D = {
  dockMaster: null, placement: {}, idxStatus: {}, idxMaster: null, floors: [],
  nextMaster: null, plans: {}, rules: {}, doorCmds: {}, doorNow: {},
  roster: [], custom: {}, layout: {}, floorMove: {}, nameOverride: {}, pmaster: null,
  targetUPH: { 日勤: 0, 夜勤: 0 },
};
let view = "dock", shift = "日勤", openId = null, showNg = false;
const closedFl = {};

/* ---------- 共通 ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const pad = n => String(n).padStart(2, "0");
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtN = n => (n == null || n === "" || isNaN(+n)) ? "—" : Math.round(+n).toLocaleString();
const fmt1 = n => (n == null || isNaN(+n)) ? "—" : (Math.round(+n * 10) / 10).toString().replace(/\.0$/, "");
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isNaN(n) ? null : n; };
const keyEnc = k => String(k).replace(/[.#$\[\]\/]/g, "_");
const uidEnc = u => String(u).replace(/[.#$\[\]\/]/g, "_");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const carrierName = v => String(v || "").replace(/^\[[^\]]*\]/, "").trim() || "（キャリア不明）";
const shortIdx = v => String(v || "").replace(/^APPOINTMENT[_ ]/i, "").replace(/^ARRIVAL[_ ]/i, "").replace(/_/g, " ");
function parseSched(v) {
  const m = String(v || "").match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\D+?(\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const h = String(v || "").match(/(\d{1,2}):(\d{2})/);
  if (!h) return null;
  const d = new Date(); d.setHours(+h[1], +h[2], 0, 0); return d;
}
function tnum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return v < 1 ? v * 24 : v;
  const m = String(v).match(/(\d{1,2})\s*[:：]\s*(\d{2})/); if (m) return +m[1] + m[2] / 60;
  const n = parseFloat(v); return isNaN(n) ? null : (n < 1 ? n * 24 : n);
}
function normMaster(v) {
  if (!v || !v.headers) return { headers: [], data: [] };
  if (Array.isArray(v.rows)) return { headers: v.headers, data: v.rows.map(r => Object.fromEntries(v.headers.map((h, i) => [h, r[i]]))) };
  return Array.isArray(v.data) ? v : { headers: v.headers, data: [] };
}

/* ---------- 表示切替 ---------- */
const VIEWS = [
  { id: "dock", name: "ドック状況" },
  { id: "plan", name: "着車プラン" },
  { id: "haichi", name: "配置" },
  { id: "att", name: "出勤者" },
];
function setView(v) {
  view = v;
  document.body.dataset.v = v;
  document.getElementById("navName").textContent = (VIEWS.find(x => x.id === v) || {}).name || "";
  VIEWS.forEach(x => { document.getElementById("v-" + x.id).hidden = x.id !== v;
    document.getElementById("v-" + x.id).scrollTop = 0; });
  document.getElementById("sw").hidden = v !== "haichi" && v !== "plan";
  closeMenu();
  try { localStorage.setItem("mView", v); } catch (e) { /* 無視 */ }
  attActivate(v === "att");
  render();
}
function closeMenu() { document.getElementById("navMenu").hidden = true; document.getElementById("navMask").hidden = true; }
(function () {
  const menu = document.getElementById("navMenu"), btn = document.getElementById("navBtn"), mask = document.getElementById("navMask");
  menu.innerHTML = VIEWS.map(v => `<button class="${v.id === view ? "cur" : ""}" data-v="${v.id}"><span class="mk"></span>${v.name}</button>`).join("");
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    menu.querySelectorAll("button").forEach(x => x.classList.toggle("cur", x === b));
    setView(b.dataset.v);
  }));
  btn.addEventListener("click", e => { e.stopPropagation(); const o = menu.hidden; menu.hidden = !o; mask.hidden = !o; });
  mask.addEventListener("click", closeMenu);
})();

/* ==========================================================
   ① ドック状況
   ========================================================== */
let dockCards = [];
function buildDock() {
  const m = normMaster(D.dockMaster);
  dockCards = (m.data || []).map(o => {
    const id = String(o[ID_FIELD] || "");
    const p = D.placement[id] || {}, st = D.idxStatus[id];
    const s = parseSched(o["Schedule Date"] || o["Expected Arrival Date"]);
    return {
      id, raw: o, carrier: carrierName(o.Carrier), units: o.Units, start: s ? s.getTime() : null,
      status: p.status || "plan", bay: p.bay || null, arriveAt: p.arriveAt || null,
      doneAt: p.doneAt || null, doneBay: p.doneBay || p.arriveBay || null,
      memo: p.memo || "", noshow: !!p.noshow, idx: (st && (st.raw || st.status)) || "",
    };
  }).filter(c => c.id);
}
const idxTag = c => c.idx ? `<span class="tag idx${/CLOSED?/i.test(c.idx) ? " ok" : ""}">${esc(shortIdx(c.idx))}</span>` : "";
function elapsedHTML(from) {
  const m = Math.max(0, Math.round((Date.now() - from) / 60000));
  return `<div class="el ${m >= 60 ? "alert" : m >= 30 ? "warn" : ""}">${m}分経過</div>`;
}
function dockCardHTML(c) {
  const late = c.status === "arrive" && c.arriveAt && Date.now() - c.arriveAt >= 60 * 60000;
  const head = c.status === "arrive" ? `<span class="bayb">${esc(c.bay || "—")}</span>`
    : `<span class="tm">${c.status === "done" ? (c.doneAt ? hhmm(c.doneAt) : "--:--") : (c.start ? hhmm(c.start) : "--:--")}</span>`;
  const sub = c.status === "arrive" ? (c.arriveAt ? elapsedHTML(c.arriveAt) : "")
    : c.status === "done" ? `<div class="el">${c.doneBay ? esc(c.doneBay) : ""}${c.arriveAt && c.doneAt ? " ・所要" + Math.round((c.doneAt - c.arriveAt) / 60000) + "分" : ""}</div>` : "";
  return `<div class="c ${c.status}${late ? " late" : ""}${c.noshow ? " abs" : ""}" onclick="openSheet('${esc(c.id)}')">
    <div class="t1">${head}<span class="u">${c.units ? fmtN(c.units) : "—"}U</span></div>
    <div class="cr">${esc(c.carrier)}</div><div class="id">${esc(c.id)}</div>
    ${sub}${c.noshow ? '<span class="tag abs">欠車</span>' : ""}${idxTag(c)}</div>`;
}
function renderDock() {
  const g = { plan: [], arrive: [], done: [] };
  dockCards.forEach(c => { if (g[c.status]) g[c.status].push(c); });
  g.plan.sort((a, b) => (a.start || 0) - (b.start || 0));
  g.arrive.sort((a, b) => String(a.bay || "").localeCompare(String(b.bay || "")));
  g.done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  ["plan", "arrive", "done"].forEach(k => {
    document.getElementById("n-" + k).textContent = g[k].length;
    document.getElementById("l-" + k).innerHTML = g[k].length ? g[k].map(dockCardHTML).join("") : `<div class="empty">なし</div>`;
  });
  if (view === "dock") document.getElementById("sub").textContent = hhmm(Date.now());
  if (openId) fillSheet(openId);
}
/* 詳細シート */
const srow = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
function fillSheet(id) {
  const c = dockCards.find(x => x.id === id);
  if (!c) { closeSheet(); return; }
  document.getElementById("s-cr").textContent = c.carrier;
  document.getElementById("s-id").textContent = c.id;
  const o = c.raw || {};
  let h = srow("状態", c.status === "plan" ? (c.noshow ? "予定（欠車）" : "予定") : c.status === "arrive" ? "着車中" : "完了");
  h += srow("受入枠", o["Schedule Date"] || "");
  if (c.status === "arrive") { h += srow("バース", c.bay || ""); h += srow("着車", c.arriveAt ? hhmm(c.arriveAt) + `（${Math.round((Date.now() - c.arriveAt) / 60000)}分経過）` : ""); }
  if (c.status === "done") {
    h += srow("バース", c.doneBay || ""); h += srow("着車", c.arriveAt ? hhmm(c.arriveAt) : ""); h += srow("完了", c.doneAt ? hhmm(c.doneAt) : "");
    if (c.arriveAt && c.doneAt) h += srow("所要", Math.round((c.doneAt - c.arriveAt) / 60000) + "分");
  }
  h += srow("Units", o.Units ? fmtN(o.Units) : "") + srow("Cartons", o.Cartons ? fmtN(o.Cartons) : "") + srow("Pallets", o.Pallets ? fmtN(o.Pallets) : "");
  h += srow("Dock", o.Dock || "") + srow("タイプ", o.Type || "") + srow("IDX", c.idx ? shortIdx(c.idx) : "") + srow("メモ", c.memo || "");
  document.getElementById("s-dl").innerHTML = h;
}
function openSheet(id) { openId = id; fillSheet(id); document.getElementById("sheet").classList.add("show"); document.getElementById("mask").classList.add("show"); }
function closeSheet() { openId = null; document.getElementById("sheet").classList.remove("show"); document.getElementById("mask").classList.remove("show"); }

/* ==========================================================
   ② 着車プラン
   ========================================================== */
let planDate = "", planAssign = {}, planUph = null, planUphF = {}, planAppts = [];
function breakRanges() {
  const src = D.rules.breaks == null ? BREAK_DEFAULT : String(D.rules.breaks);
  const out = [];
  src.split(/[,、\s]+/).forEach(t => {
    const m = String(t).match(/^(\d{1,2}):(\d{2})[-–~〜](\d{1,2}):(\d{2})$/);
    if (!m) return;
    let a = +m[1] + +m[2] / 60, b = +m[3] + +m[4] / 60;
    if (b <= a) b += 24;
    out.push([a, b], [a + 24, b + 24]);
  });
  return out;
}
function breakOv(s, e) {
  let m = 0;
  breakRanges().forEach(r => { m += Math.max(0, Math.min(e, r[1]) - Math.max(s, r[0])); });
  return Math.min(m, Math.max(0, e - s));
}
const pmasterOk = () => D.pmaster && ["OUT", "IN", "ICQA"].some(k => Array.isArray(D.pmaster[k]) && D.pmaster[k].length);
function people() {
  const list = Array.isArray(D.roster) ? D.roster.filter(Boolean).slice() : [];
  Object.values(D.custom || {}).forEach(c => { if (c && !list.some(p => p.no === c.no)) list.push(c); });
  return list;
}
function locOf(p) {
  const k = uidEnc(p.no + "_" + p.name), L = D.layout[k];
  const valid = (pl, sub) => !pmasterOk() || (Array.isArray(D.pmaster[pl]) && D.pmaster[pl].includes(sub));
  if (L !== undefined && L !== null) {
    if (["WAIT", "ABSENT", "HOLIDAY", "other"].includes(L)) return L;
    const pt = String(L).split("|");
    if (pt.length >= 2 && valid(pt[0], pt[1])) return pt[0] + "|" + pt[1];
    return "WAIT";
  }
  return valid(p.section, p.subsec) ? p.section + "|" + p.subsec : "WAIT";
}
const floorOfP = p => { const k = uidEnc(p.no + "_" + p.name); return D.floorMove[k] !== undefined ? D.floorMove[k] : p.floor; };
const uphOf = sh => (planUph && planUph[sh] > 0) ? +planUph[sh] : (+D.targetUPH[sh] || 0);
const uphFor = (f, sh) => (planUphF && +planUphF[f] > 0) ? +planUphF[f] : uphOf(sh);

function buildPlan() {
  const M = D.nextMaster || D.dockMaster;
  const all = [];
  if (M && Array.isArray(M.headers) && Array.isArray(M.rows)) {
    const hi = {}; M.headers.forEach((h, i) => hi[h] = i);
    const g = (r, k) => hi[k] == null ? "" : r[hi[k]];
    M.rows.forEach(r => {
      const id = String(g(r, ID_FIELD) || "").trim(); if (!id) return;
      const dt = parseSched(g(r, "Schedule Date")) || parseSched(g(r, "Expected Arrival Date"));
      all.push({ id, key: keyEnc(id), dt, cname: carrierName(g(r, "Carrier")),
        units: num(g(r, "Units")), cartons: num(g(r, "Cartons")), dock: String(g(r, "Dock") || "").split("[")[0].trim() });
    });
  }
  const cnt = {};
  all.forEach(a => { if (a.dt) { const k = ymd(a.dt); cnt[k] = (cnt[k] || 0) + 1; } });
  planDate = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0] || "";
  planAppts = all;
  const pl = D.plans[planDate] || {};
  planAssign = pl.assign || {}; planUph = pl.uph || null; planUphF = pl.uphF || {};
}
// HC・LHは配置ダッシュボードの配置サマリ（IN）と同じ数え方（PC版の着車プランと同じ）
//   選択シフトの人だけ／管理者は除外／LH＝各人のLHの合計（未入力は0）／出退勤時刻が無い人も数える
function planCalc() {
  const F = {};
  D.floors.forEach(f => F[f.name] = { hc: 0, lh: 0, cap: 0, n: 0, u: 0 });
  people().forEach(p => {
    if (p.admin || p.shift !== shift) return;
    if (!locOf(p).startsWith("IN|")) return;
    const fl = F[floorOfP(p)]; if (!fl) return;
    const lh = num(p.lh) > 0 ? num(p.lh) : 0;
    fl.hc++; fl.lh += lh; fl.cap += lh * uphFor(floorOfP(p), shift);
  });
  planAppts.forEach(a => {
    const f = (planAssign[a.key] || {}).f;
    if (f && F[f]) { F[f].n++; F[f].u += (a.units != null ? a.units : (a.cartons ? a.cartons * 10 : 0)); }
  });
  return F;
}
const floorDigit = f => ((String(f).match(/(\d)/) || [])[1] || "");
function curDoor(a) {
  const v = D.doorNow[a.id];
  if (v && v.door && Date.now() - (v.at || 0) < DOORSTATE_TTL) return String(v.door);
  return a.dock || "";
}
function latestCmd(id) {
  let best = null;
  Object.values(D.doorCmds || {}).forEach(c => {
    if (!c || c.id !== id || Date.now() - (c.at || 0) > DOOR_TTL) return;
    if (!best || (c.at || 0) > (best.at || 0)) best = c;
  });
  return best;
}
function reflectState(a) {
  const f = (planAssign[a.key] || {}).f;
  if (!f) return null;
  const d = curDoor(a);
  const done = d && floorDigit(f) && String(d)[0] === floorDigit(f);
  const c = latestCmd(a.id);
  if (c && c.state === "running") return "run";
  if (c && c.state === "pending") return "wait";
  if (done) return "ok";
  if (c && c.state === "error") return "ng";
  return "no";
}
function toggleNg() { showNg = !showNg; render(); }
function renderPlan() {
  const sh = shifts();
  if (!sh.includes(shift)) shift = sh[0];
  document.getElementById("sw").innerHTML = sh.map(x => `<button class="${x === shift ? "on" : ""}" onclick="setShift('${esc(x)}')">${esc(x)}</button>`).join("");
  const F = planCalc();
  const tot = { n: 0, u: 0, hc: 0, lh: 0, cap: 0 };

     <div><b>${g.no.length}</b><span>未反映</span></div>`;

      <div>${esc(c.message || "理由の記録がありません")}</div></div>`;
  }).join("") : "";
}

const dispName = p => { const v = D.nameOverride[uidEnc(p.no + "_" + p.name)]; return (v !== undefined && v !== "") ? v : p.name; };
function roleStyle(r) {
  if (ROLE_STYLES[r]) return ROLE_STYLES[r];
  if (!r) return { bg: "#94a3b8", fg: "#fff" };
  const all = people();
  if (all.length !== _roleAutoVer) {
    _roleAuto.clear();
    const known = Object.keys(ROLE_STYLES);
    [...new Set(all.map(p => p.role).filter(x => x && !known.includes(x)))].sort()
      .forEach((rr, i) => _roleAuto.set(rr, { bg: ROLE_AUTO_COLORS[i % ROLE_AUTO_COLORS.length], fg: "#fff" }));
    _roleAutoVer = all.length;
  }
  return _roleAuto.get(r) || { bg: "#94a3b8", fg: "#fff" };
}
const sortP = (a, b) => (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) || (a.no - b.no);
function shifts() {
  const s = new Set();
  people().forEach(p => { if (p.shift) s.add(p.shift); });
  const base = ["日勤", "夜勤"].filter(x => s.has(x));
  [...s].forEach(x => { if (!base.includes(x)) base.push(x); });
  return base.length ? base : ["日勤"];
}
function setShift(s) { shift = s; render(); }
function toggleFloor(f) { closedFl[f] = !closedFl[f]; render(); }
function chip(p) {
  const st = roleStyle(p.role), dn = dispName(p);
  const ini = (!dn || /^\d+$/.test(String(dn).trim())) ? (String(p.role || "?").trim()[0] || "?") : String(dn).trim()[0];
  const cls = "ch" + (p.admin ? " adm" : "") + (p.shift === "夜勤" ? " night" : "");
  return `<button class="${cls}" style="background:${st.bg};color:${st.fg}" title="${esc(dn)}"
    onclick="showPerson('${esc(uidEnc(p.no + "_" + p.name))}')">${esc(ini)}${p.fork ? '<span class="fk">F</span>' : ""}</button>`;
}
// 丸バッジをタップしたときの吹き出し
function showPerson(k) {
  const p = people().find(x => uidEnc(x.no + "_" + x.name) === k);
  const el = document.getElementById("pop");
  if (!p) { el.hidden = true; return; }

  el.innerHTML = `<b>${esc(dispName(p))}</b><span>${esc(p.role || "")} ／ ${esc(floorOfP(p) || "")} ${esc(lb)} ／ LH ${fmt1(p.lh || 0)}${p.fork ? " ／ F" : ""}${p.shift === "夜勤" ? " ／ 夜勤" : ""}</span>`;

function renderHaichi() {
  const sh = shifts();
  if (!sh.includes(shift)) shift = sh[0];
  document.getElementById("sw").innerHTML = sh.map(x => `<button class="${x === shift ? "on" : ""}" onclick="setShift('${esc(x)}')">${esc(x)}</button>`).join("");

  const all = people().filter(p => p.shift === shift);
  const work = all.filter(p => !["WAIT", "ABSENT", "HOLIDAY"].includes(locOf(p)));
  if (view === "haichi") document.getElementById("sub").textContent = `稼働 ${work.length}名 / 全${all.length}名`;

  const sum = list => ({ hc: list.length, lh: list.reduce((s, p) => s + (p.lh || 0), 0) });
  const byPlace = pl => sum(work.filter(p => locOf(p).split("|")[0] === pl));
  const tile = (label, v, cls) => `<div class="kpi4 ${cls || ""}"><span>${label}</span><b>${v.hc}<small>名</small></b><em>LH ${fmt1(v.lh)}</em></div>`;
  document.getElementById("hKpis").innerHTML =
    tile("稼働", sum(work), "all") + tile("OUT", byPlace("OUT")) + tile("IN", byPlace("IN")) + tile("ICQA", byPlace("ICQA"));

  let h = "";
  D.floors.forEach((f, i) => {
    const fn = f.name;
    const mem = all.filter(p => floorOfP(p) === fn && !["WAIT", "ABSENT", "HOLIDAY"].includes(locOf(p)));
    const lh = mem.reduce((s, p) => s + (p.lh || 0), 0), col = `var(--f${i % 5})`;
    const groups = [];
    PLACES.forEach(pl => {
      if (pl === "other") { const gg = mem.filter(p => locOf(p) === "other"); if (gg.length) groups.push({ label: "その他", sub: "", list: gg }); return; }
      ((D.pmaster || {})[pl] || []).forEach(sub => {
        const gg = mem.filter(p => locOf(p) === pl + "|" + sub);
        if (gg.length) groups.push({ label: pl, sub, list: gg });
      });
    });
    h += `<div class="hf${closedFl[fn] ? " cl" : ""}">
      <div class="hf-h" onclick="toggleFloor('${esc(fn)}')"><span class="ar">▼</span>
        <span class="nm" style="color:${col}">${esc(fn)}</span><span class="m">${mem.length}名 ・ LH ${fmt1(lh)}</span></div>
      <div class="hf-b">${groups.length ? groups.map(g => `<div class="gr">
        <div class="gr-h"><b>${esc(g.sub || g.label)}</b>${g.sub ? `<span>${esc(g.label)}</span>` : ""}
          <span class="n">${g.list.length}名 ・ ${fmt1(g.list.reduce((s, p) => s + (p.lh || 0), 0))}</span></div>
        <div class="chips">${g.list.slice().sort(sortP).map(chip).join("")}</div></div>`).join("")
        : `<div class="empty">配置なし</div>`}</div></div>`;
  });
  const nw = NONWORK.map(([loc, label]) => ({ label, list: all.filter(p => locOf(p) === loc) })).filter(x => x.list.length);
  if (nw.length) {
    h += `<div class="hf nw${closedFl["_nw"] ? " cl" : ""}"><div class="hf-h" onclick="toggleFloor('_nw')">
      <span class="ar">▼</span><span class="nm" style="color:var(--sub)">待機・欠勤・休日</span>
      <span class="m">${nw.reduce((s, x) => s + x.list.length, 0)}名</span></div>
      <div class="hf-b">${nw.map(x => `<div class="gr"><div class="gr-h"><b>${esc(x.label)}</b><span class="n">${x.list.length}名</span></div>
        <div class="chips">${x.list.slice().sort(sortP).map(chip).join("")}</div></div>`).join("")}</div></div>`;
  }
  document.getElementById("hBody").innerHTML = h || `<div class="empty">データがありません</div>`;
}

/* ==========================================================
   ④ 出勤者（無線管理システム radio-lending の出勤者一覧を読むだけ）
   出勤者（IDカード）＋ 貸出中の機器 ＋ バッチIDに紐づくAmazonエイリアス
   この画面を開いている間だけ取得・更新する（他の画面では通信しない）
   ========================================================== */
const RADIO_URL = "https://radio-lending.takahiro884.workers.dev";   // 無線管理システムのURL
const AT_KINDS = [["radio", "無線"], ["mobile", "モバイル"], ["pc", "PC"]];
let AT = null, atFilter = "all", atQ = "", atLoading = false, atAgain = false, atWs = null, atRetry = 0, atT = null, atPoll = null, atOn = false;
try { atFilter = localStorage.getItem("mAtt_filter") || "all"; } catch (e) { /* 無視 */ }
const atNorm = s => String(s == null ? "" : s).trim().replace(/\s+/g, "").toUpperCase();
// 検索用：全角英数→半角、カタカナ→ひらがな、空白除去、小文字
const atFold = s => String(s == null ? "" : s)
  .replace(/[Ａ-Ｚａ-ｚ０-９＃]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
  .replace(/[\s　]+/g, "").toLowerCase();
function atHl(text, q) {
  const t = String(text == null ? "" : text);
  if (!q) return esc(t);
  const f = atFold(t), i = f.indexOf(q);
  if (i < 0 || f.length !== t.length) return esc(t);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
}
/* ==========================================================
   出勤者の履歴（日付で見る・人で探す）共通部品  2026-09-25
   ATH.navHtml(date, biz) … 日付切替バーのHTML
   ATH.person(el, base, onGoDay) … 「人で探す」画面を el に作る
   ========================================================== */
var ATH = (function () {
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }
  function pd(d) { var p = String(d || "").split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ymd(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = pd(d); x.setDate(x.getDate() + n); return ymd(x); }
  function md(d) { var x = pd(d); return (x.getMonth() + 1) + "/" + x.getDate(); }
  function wd(d) { return WD[pd(d).getDay()]; }
  function devLabel(kind, no) {
    no = String(no == null ? "" : no);
    if (kind === "radio") return "無線" + (/^#/.test(no) ? no : "#" + no);
    return no;
  }
  function mins(t) { var m = String(t || "").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function durTxt(a, b) {
    var x = mins(a), y = mins(b); if (x == null || y == null) return "";
    if (y < x) y += 1440;
    var m = y - x; return Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "");
  }
  /* ---- 日付切替バー ---- */
  function navHtml(date, biz) {
    var past = date && biz && date < biz;
    return '<div class="ath-nav">' +
      '<button type="button" data-ath="prev" aria-label="前日">‹</button>' +
      '<label class="ath-d">' + (date ? md(date) + "（" + wd(date) + "）" : "—") +
      '<small>' + (past ? "締め済み" : "現在の業務日") + '</small>' +
      '<input type="date" data-ath="pick" value="' + esc(date || "") + '" max="' + esc(biz || "") + '"></label>' +
      '<button type="button" data-ath="next" aria-label="翌日"' + (past ? "" : " disabled") + '>›</button>' +
      '<button type="button" class="ath-today" data-ath="today"' + (past ? "" : " disabled") + '>今日</button></div>' +
      (past ? '<div class="ath-past">過去の業務日を表示中です。◯はその日に持ち出していた機器、時刻は締め時点の記録です</div>' : "");
  }
  // bar 内のボタンに動作を付ける。onDate(新しい日付 or ""＝現在の業務日)
  function bindNav(root, date, biz, onDate) {
    function go(d) { if (!d || d >= biz) onDate(""); else onDate(d); }
    root.querySelectorAll("[data-ath]").forEach(function (el) {
      var k = el.getAttribute("data-ath");
      if (k === "pick") el.onchange = function () { if (el.value) go(el.value); };
      else el.onclick = function () {
        if (k === "prev") go(addDays(date || biz, -1));
        else if (k === "next") go(addDays(date || biz, 1));
        else go("");
      };
    });
  }
  /* ---- 人で探す ---- */
  function person(el, base, onGoDay) {
    var st = { q: "", days: 30, data: null, cur: 0, loading: false, err: "" };
    try { st.days = +localStorage.getItem("ath_days") || 30; } catch (e) {}
    el.innerHTML =
      '<div class="ath-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="バッチID・名前・エイリアスで検索（2文字以上）"></div>' +
      '<div class="ath-per">' + [7, 30, 90].map(function (d) { return '<button type="button" data-d="' + d + '">' + d + '日</button>'; }).join("") + '</div>' +
      '<div class="ath-res"><div class="ath-hint">名前やバッチIDを入れると、期間内の出勤日と持ち出した機器を表示します</div></div>';
    var inp = el.querySelector("input"), res = el.querySelector(".ath-res"), t = null, seq = 0;
    function perBtns() { el.querySelectorAll(".ath-per button").forEach(function (b) { b.classList.toggle("on", +b.dataset.d === st.days); }); }
    perBtns();
    el.querySelectorAll(".ath-per button").forEach(function (b) {
      b.onclick = function () { st.days = +b.dataset.d; try { localStorage.setItem("ath_days", st.days); } catch (e) {} perBtns(); search(); };
    });
    inp.addEventListener("input", function () { clearTimeout(t); t = setTimeout(search, 400); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { clearTimeout(t); search(); inp.blur(); } });
    function search() {
      var q = inp.value.trim(); st.q = q;
      if (q.length < 2) { st.data = null; res.innerHTML = '<div class="ath-hint">2文字以上入れてください</div>'; return; }
      var my = ++seq; res.innerHTML = '<div class="ath-hint">検索中…</div>';
      fetch(base + "/api/mobile/person?q=" + encodeURIComponent(q) + "&days=" + st.days, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (j) { if (my !== seq) return; st.data = j; st.cur = 0; draw(); })
        .catch(function (e) { if (my !== seq) return; res.innerHTML = '<div class="ath-err">読み込めませんでした（' + esc(e.message) + '）</div>'; });
    }
    function draw() {
      var j = st.data, ps = (j && j.people) || [];
      if (!ps.length) { res.innerHTML = '<div class="ath-hint">直近' + st.days + '日に該当する出勤記録はありません</div>'; return; }
      var h = "";
      if (ps.length > 1) {
        h += '<div class="ath-cand"><div class="h">候補 ' + ps.length + '名' + (j.more ? "以上（絞り込んでください）" : "") + '（タップで切り替え）</div>' +
          ps.map(function (p, i) {
            return '<button type="button" data-i="' + i + '" class="' + (i === st.cur ? "on" : "") + '"><span class="nm' + (p.lent ? " lent" : "") + '">' + esc(p.name || "（名前なし）") + '</span>' +
              '<span class="id">' + esc(p.badge) + '</span>' + (p.alias ? '<span class="al">' + esc(p.alias) + '</span>' : "") +
              '<span class="ath-c">' + p.days.length + '日</span></button>';
          }).join("") + '</div>';
      }
      var p = ps[st.cur], dev = 0;
      p.days.forEach(function (d) { dev += d.devices.length; });
      h += '<div class="ath-pcard"><div class="nm"><span class="' + (p.lent ? "lent" : "") + '">' + esc(p.name || "（名前なし）") + '</span></div>' +
        '<div class="meta">' + esc(p.badge) + (p.alias ? ' ・ <span class="al">' + esc(p.alias) + '</span>' : "") + (p.company ? " ・ " + esc(p.company) : "") + '</div>' +
        '<div class="kp"><div><span>出勤日数</span><b>' + p.days.length + '</b>日</div><div><span>最終出勤</span><b>' + (p.days[0] ? md(p.days[0].date) : "—") + '</b></div>' +
        '<div><span>機器の持出</span><b>' + dev + '</b>回</div></div></div>';
      h += p.days.map(function (d) {
        var w = pd(d.date).getDay(), today = j.businessDate === d.date;
        var tm = esc(d.lend || "—") + " → ";
        if (d.open && today) tm += "（勤務中）";
        else if (d.open) tm += '—<span class="nr">IDカード返却の記録なし</span>';
        else tm += (mins(d.ret) != null && mins(d.lend) != null && mins(d.ret) < mins(d.lend) ? "翌 " : "") + esc(d.ret || "—") + '<span class="dur">' + durTxt(d.lend, d.ret) + '</span>';
        var chips = d.devices.map(function (x) { return '<span class="ath-chip ' + x.kind + '">' + esc(devLabel(x.kind, x.no)) + '</span>'; });
        if (!chips.length) chips = ['<span class="ath-chip none">機器なし</span>'];
        return '<div class="ath-day"><div class="dt' + (w === 6 ? " sat" : w === 0 ? " sun" : "") + '"><b>' + md(d.date) + '</b><span>' + (today ? "今日" : WD[w] + "曜") + '</span></div>' +
          '<div class="bd"><div class="tm">' + tm + '</div><div class="chips">' + chips.join("") + '</div></div>' +
          '<button type="button" class="go" data-go="' + esc(d.date) + '">この日の一覧</button></div>';
      }).join("");
      res.innerHTML = h;
      res.querySelectorAll(".ath-cand button").forEach(function (b) { b.onclick = function () { st.cur = +b.dataset.i; draw(); }; });
      res.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { onGoDay(b.getAttribute("data-go") === j.businessDate ? "" : b.getAttribute("data-go")); }; });
    }
    return { focus: function () { try { inp.focus(); } catch (e) {} } };
  }
  return { navHtml: navHtml, bindNav: bindNav, person: person, md: md, wd: wd };
})();

    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => { AT = j; AT.emp = j.emp || {}; AT.aliases = j.aliases || {}; AT.err = ""; AT.at = Date.now(); })
    .catch(e => { AT = AT || { list: [], boards: {}, emp: {}, aliases: {} }; AT.err = "無線管理システムから読み込めませんでした（" + e.message + "）"; })
    .then(() => { atLoading = false; if (view === "att") render(); if (atAgain) { atAgain = false; attLoad(); } });
}
// 受付PCと同じWebSocketで変更を受け取る（画面を開いている間だけ）
function atConnect() {
  if (!atOn || document.hidden) return;
  try { atWs = new WebSocket(RADIO_URL.replace(/^http/, "ws") + "/ws"); } catch (e) { atReconnect(); return; }
  atWs.onopen = () => { atRetry = 0; };
  atWs.onmessage = ev => { let m = {}; try { m = JSON.parse(ev.data); } catch (e) { /* 無視 */ }
    if (m && m.type === "changed") { clearTimeout(atT); atT = setTimeout(attLoad, 400); } };
  atWs.onclose = atReconnect;
  atWs.onerror = () => { try { atWs.close(); } catch (e) { /* 無視 */ } };
}
function atReconnect() {
  if (!atOn || document.hidden) return;
  atRetry = Math.min(atRetry + 1, 6);
  setTimeout(() => { if (atOn && (!atWs || atWs.readyState > 1)) atConnect(); }, Math.min(1000 * atRetry, 8000));
}
function atDisconnect() { const w = atWs; atWs = null; if (w) { w.onclose = null; try { w.close(); } catch (e) { /* 無視 */ } } }
function attActivate(on) {
  if (on === atOn) return;
  atOn = on;
  clearInterval(atPoll);
  if (on) {
    attLoad(); atConnect();
    atPoll = setInterval(() => { if (!document.hidden && (!atWs || atWs.readyState !== 1)) attLoad(); }, 60000);
  } else atDisconnect();
}
document.addEventListener("visibilitychange", () => {
  if (!atOn) return;
  if (document.hidden) atDisconnect(); else { attLoad(); if (!atWs) atConnect(); }
});
function atBuild() {
  const past = !!(AT.date && AT.businessDate && AT.date < AT.businessDate);   // 過去日は返却済みの機器も「持ち出した機器」として出す
  const boards = AT.boards || {}, byName = {}, used = {};
  const nameOf = a => (a.inputName || "").trim() || (a.accountName || "").trim() || ((AT.emp[atNorm(a.key)] || {}).name || "");
  AT_KINDS.forEach(([k]) => (boards[k] || []).forEach(r => {
    if (!r.name || !r.out || (!past && r.ret)) return;
    (byName[r.name.trim()] = byName[r.name.trim()] || []).push({ kind: k, no: r.no, id: k + "|" + r.no });
  }));
  const rows = (AT.list || []).map(a => {
    const name = nameOf(a), devs = byName[name.trim()] || [];
    devs.forEach(d => { used[d.id] = 1; });
    const dv = {}; AT_KINDS.forEach(([k]) => { dv[k] = devs.filter(d => d.kind === k).map(d => d.no); });
    const alias = AT.aliases[atNorm(a.key)] || "";
    return { key: a.key || "", name, lent: !!(a.inputName && a.inputName.trim()), account: a.accountName || "", company: a.company || "",
      alias, lend: a.lendTime || "", ret: a.returnTime || "", dv, nDev: devs.length,
      text: atFold([a.key, name, a.accountName, a.company, alias].concat(devs.map(d => d.no)).join(" ")) };
  });
  rows.sort((x, y) => (!!x.ret - !!y.ret) || (x.company < y.company ? -1 : x.company > y.company ? 1 : 0) || x.name.localeCompare(y.name, "ja"));
  const orphan = [];
  AT_KINDS.forEach(([k, lb]) => (boards[k] || []).forEach(r => {
    if (r.name && r.out && (past || !r.ret) && !used[k + "|" + r.no]) orphan.push({ kind: lb, k, no: r.no, name: r.name });
  }));
  return { rows, orphan, past };
}
function renderAtt() {
  document.querySelectorAll("#atChips button").forEach(b => b.classList.toggle("on", b.dataset.f === atFilter));
  document.getElementById("atErr").innerHTML = AT && AT.err ? `<div class="at-err">${esc(AT.err)}</div>` : "";
  if (atMode === "person") { document.getElementById("sub").textContent = "人で探す"; return; }
  if (!AT || !AT.list) { document.getElementById("sub").textContent = "読み込み中…"; return; }
  const B = atBuild(), q = atFold(atQ);
  const nav = document.getElementById("atNav");
  nav.innerHTML = ATH.navHtml(AT.date || AT.businessDate, AT.businessDate);
  ATH.bindNav(nav, AT.date || AT.businessDate, AT.businessDate, d => { atDate = d; attLoad(); });
  const work = B.rows.filter(r => !r.ret).length;
  document.getElementById("sub").textContent = B.past ? `${ATH.md(AT.date)}（締め済み）・ 出勤 ${B.rows.length}名`
    : (AT.businessDate ? "業務日 " + AT.businessDate.slice(5).replace("-", "/") + " ・ " : "") + `勤務中 ${work}名`;
  const cK = {}; AT_KINDS.forEach(([k]) => { cK[k] = B.orphan.filter(o => o.k === k).length; });
  B.rows.forEach(r => AT_KINDS.forEach(([k]) => { cK[k] += r.dv[k].length; }));
  document.getElementById("atSum").innerHTML =
    `<div><span>出勤</span><b>${B.rows.length}</b></div><div><span>勤務中</span><b>${work}</b></div>` +
    AT_KINDS.map(([k, lb]) => `<div><span>${lb}貸出</span><b>${cK[k]}</b></div>`).join("");
  const rows = B.rows.filter(r => !(atFilter === "work" && r.ret) && !(atFilter === "dev" && !r.nDev) && (!q || r.text.indexOf(q) >= 0));
  document.getElementById("atCnt").textContent = `${rows.length} / ${B.rows.length}名`;
  document.getElementById("atList").innerHTML = !rows.length
    ? `<div class="empty">${B.rows.length ? "該当する人がいません" : "この業務日の出勤者はまだいません"}</div>`
    : `<table class="at-tb"><thead><tr><th class="l cid">バッチID</th><th class="l">名前</th>${AT_KINDS.map(([, lb]) => `<th class="cdv">${lb}</th>`).join("")}</tr></thead><tbody>` +
      rows.map(r => {
        const sub = [];
        if (r.ret) sub.push(B.past && r.lend ? esc(r.lend) + "〜" + esc(r.ret) : "返却 " + esc(r.ret));
        else if (B.past) sub.push(esc(r.lend || "—") + "〜 返却なし");
        else if (r.lend) sub.push("出勤 " + esc(r.lend));
        return `<tr class="${r.ret && !B.past ? "off" : ""}"><td class="id">${atHl(r.key, q)}${r.alias ? `<span class="al">${atHl(r.alias, q)}</span>` : ""}</td>` +
          `<td class="nm${r.lent ? " lent" : ""}"><span class="n">${atHl(r.name || "（名前なし）", q)}</span>${sub.length ? `<small>${sub.join(" ・ ")}</small>` : ""}</td>` +
          AT_KINDS.map(([k]) => `<td class="dv">${r.dv[k].length ? `<b>◯</b><small>${r.dv[k].map(n => atHl(n, q)).join("<br>")}</small>` : ""}</td>`).join("") + `</tr>`;
      }).join("") + `</tbody></table>`;
  const orph = B.orphan.filter(o => !q || atFold(o.no + " " + o.name + " " + o.kind).indexOf(q) >= 0);
  document.getElementById("atOrph").innerHTML = orph.length ? `<div class="sec">出勤者一覧に名前がない貸出中の機器（${orph.length}）</div><div class="at-orph">` +
    orph.map(o => `<span><b>${esc(o.kind)} ${esc(o.no)}</b>${esc(o.name)}</span>`).join("") + `</div>` : "";
  const t = new Date(AT.at || Date.now());
  document.getElementById("atFt").textContent = `最終取得 ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}` +
    (AT.aliasError ? "（エイリアス取得不可）" : "") + " ／ 閲覧専用です。貸出・返却は無線管理の受付PCから行ってください。";
  document.documentElement.style.setProperty("--atBarH", document.getElementById("atBar").offsetHeight + "px");
}
(function () {
  let qt = null;
  document.getElementById("atQ").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { atQ = e.target.value; render(); }, 120); });
  document.querySelectorAll("#atChips button").forEach(b => b.addEventListener("click", () => {
    atFilter = b.dataset.f; try { localStorage.setItem("mAtt_filter", atFilter); } catch (e) { /* 無視 */ } render();
  }));
})();

/* ---------- Firebase（接続は1回だけ・読むだけ） ---------- */
function start() {
  const db = firebase.database(), root = db.ref(DOCK_ROOT);
  db.ref(".info/connected").on("value", s => document.getElementById("dot").classList.toggle("on", s.val() === true));
  const on = (ref, fn) => ref.on("value", s => { fn(s.val()); render(); });
  on(root.child("master"), v => { D.dockMaster = v; buildDock(); buildPlan(); });
  on(root.child("placement"), v => { D.placement = v || {}; buildDock(); });
  on(root.child("idxStatus"), v => { D.idxStatus = v || {}; buildDock(); });
  on(root.child("idxMaster"), v => { D.idxMaster = v || null; });
  on(root.child("floors"), v => { D.floors = Array.isArray(v) ? v.filter(Boolean) : []; });
  on(root.child("nextMaster"), v => { D.nextMaster = v; buildPlan(); });
  on(root.child("plans"), v => { D.plans = v || {}; buildPlan(); });
  on(root.child("planRules"), v => { D.rules = v || {}; });
  on(root.child("doorCommands"), v => { D.doorCmds = v || {}; });
  on(root.child("doorState"), v => { D.doorNow = v || {}; });
  on(db.ref("roster"), v => { D.roster = Array.isArray(v) ? v : (v ? Object.values(v) : []); });
  on(db.ref("custom"), v => { D.custom = v || {}; });
  on(db.ref("layout"), v => { D.layout = v || {}; });
  on(db.ref("floorMove"), v => { D.floorMove = v || {}; });
  on(db.ref("nameOverride"), v => { D.nameOverride = v || {}; });
  on(db.ref("master"), v => { D.pmaster = v || null; });
  on(db.ref("targetUPH"), v => { const x = v || {}; D.targetUPH = { 日勤: +(x.日勤 && x.日勤.in) || 0, 夜勤: +(x.夜勤 && x.夜勤.in) || 0 }; });
}
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(u => { if (u) start(); });
  firebase.auth().signInAnonymously().catch(() => {
    document.getElementById("l-plan").innerHTML = '<div class="empty">接続できませんでした</div>';
  });
} catch (e) { /* 無視 */ }

try { const v = localStorage.getItem("mView"); if (v && VIEWS.some(x => x.id === v)) setView(v); else setView("dock"); } catch (e) { setView("dock"); }
setInterval(render, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>

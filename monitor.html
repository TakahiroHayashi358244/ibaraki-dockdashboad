<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進捗モニター</title>
<style>
  :root{--ink:#020617;--sub:#334155;--ok:#15803d;--wn:#c2410c;--ng:#dc2626}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#cbd5e1;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;padding:1vh 2.4vw;background:#0f172a;color:#fff}
  header .l{display:flex;align-items:center;gap:1.6vw}header .r{text-align:right}
  header h1{margin:0;font-size:3vh;font-weight:800;letter-spacing:.05em}
  header .sh{font-size:2.8vh;font-weight:900;padding:.3vh 1.2vw;border-radius:99px;background:#fff;color:#0f172a}
  header .sp{flex:1}
  header .clk{font-size:7vh;line-height:1.1;letter-spacing:.04em;font-weight:800;font-variant-numeric:tabular-nums}
  header .at{font-size:2.6vh;font-weight:800;color:#e2e8f0}
  main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:.6vw;padding:.6vw}
  .card{background:#fff;border-radius:1.2vh;box-shadow:0 2px 8px rgba(15,23,42,.18);display:flex;flex-direction:column;align-items:center;padding:2vh 2vw;min-height:0}
  .ttl{display:flex;align-items:center;gap:1vw;font-size:4vh;font-weight:900;flex:none}
  .ttl .tag{font-size:2.4vh;color:#fff;background:var(--c);padding:.2vh 1vw;border-radius:.8vh}
  .st{font-size:3.4vh;margin-left:.6vw;font-weight:900;padding:.3vh 2.4vw;border-radius:99px;color:#fff}
  .st.ok{background:var(--ok)}.st.wn{background:#ea580c}.st.ng{background:var(--ng)}.st.na{background:#475569}
  .ring{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .ring{margin:.6vh 0}.ring svg{height:100%;width:auto}
  .rows{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4vw;width:100%}
  .pr{border-radius:1.4vh;background:#f1f5f9;border:2px solid #cbd5e1;padding:1.2vh 1.2vw;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:.2vh 1vw}
  .pr .n{font-size:3vh;font-weight:900;color:var(--pc)}
  .pr .p{font-size:5.2vh;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
  .pr .d{grid-column:1/3;display:flex;justify-content:space-between;font-size:2.3vh;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
  .pr .d b{color:var(--ink)}
  .ft{margin-top:1.4vh;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;width:100%}
  .ft > div{text-align:center;white-space:nowrap}
  .ft span{display:block;font-size:2.2vh;color:var(--sub);font-weight:800}
  .ft b{font-size:4vh;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}.ft small{font-size:2vh;font-weight:800;margin-left:.4vw}

  /* 工程の枠・下の数字の行は、数字の桁が増えても折り返さず高さを一定にする */
  .pr{height:14vh;grid-template-rows:auto auto;align-content:center;overflow:hidden;min-width:0}
  .pr .n,.pr .p{white-space:nowrap}
  .pr .n{font-size:min(3vh,1.6vw)}.pr .p{font-size:min(5.2vh,2.8vw);line-height:1.1}
  .pr .d{white-space:nowrap;gap:.6vw;font-size:min(2.3vh,1.05vw);min-width:0}
  .pr .d > span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ft{height:9vh;align-items:center}
  .ft > div{min-width:0;overflow:hidden}
  .ft b{font-size:min(4vh,2.1vw)}.ft small{font-size:min(2vh,1.05vw)}.ft span{font-size:min(2.2vh,1.15vw)}

  /* 見出し・状態・上の帯も、画面の縦横比が変わっても折り返さない */
  .ttl{white-space:nowrap;font-size:min(4vh,2.1vw)}
  .ttl .tag{font-size:min(2.4vh,1.3vw)}
  .st{white-space:nowrap;font-size:min(3.4vh,1.8vw)}
  header .l{white-space:nowrap;min-width:0}
  header h1{font-size:min(3vh,1.6vw)}
  header .sh{font-size:min(2.8vh,1.4vw)}
  header .clk{font-size:min(7vh,4.2vw)}
  header .at{font-size:min(2.6vh,1.4vw);white-space:nowrap}

  /* 画面スリープ防止の状態（右上の小さな表示） */
  header .r{display:flex;flex-direction:column;align-items:flex-end;gap:.3vh}
  header .wl{font-size:min(1.7vh,.95vw);font-weight:800;padding:.1vh .7vw;border-radius:99px;white-space:nowrap;cursor:pointer}
  header .wl.on{background:#14532d;color:#bbf7d0}header .wl.off{background:#7f1d1d;color:#fecaca}

  /* 工程の枠は1行にまとめて高さを抑え、そのぶん円グラフを大きくする */
  .rows{gap:1vw}
  .pr{height:8.4vh;padding:0 1vw;grid-template-columns:auto auto minmax(0,1fr);grid-template-rows:1fr;align-items:center;gap:0 .7vw;border-radius:1.2vh;padding:0 .8vw}
  .pr .n{font-size:min(2.8vh,1.3vw)}
  .pr .p{font-size:min(4.6vh,1.9vw);line-height:1;text-align:left}
  .pr .d > span{max-width:100%}
  .pr .d{grid-column:auto;flex-direction:column;align-items:flex-end;justify-content:center;gap:.2vh;font-size:min(1.9vh,.9vw);line-height:1.15}
  .ft{height:7vh;margin-top:1vh}
  .ft b{font-size:min(3.6vh,1.9vw)}.ft span{font-size:min(1.9vh,1vw)}
  .card{padding:1.4vh 1.6vw}
  .ring{margin:.2vh 0}

  /* 工程の枠は円グラフの上の左右の角に置き、円グラフを避ける。円グラフはカードの高さいっぱいまで大きくする */
  .card{position:relative}
  .rows{position:absolute;top:8vh;left:1vw;right:1vw;width:auto;display:flex;justify-content:space-between;gap:0;pointer-events:none}
  .pr{width:max-content;max-width:24%;flex:none;height:auto;padding:.8vh .8vw;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-items:baseline;gap:.4vh .6vw}
  .pr .n{font-size:min(2.3vh,1.05vw)}
  .pr .p{font-size:min(3.8vh,1.75vw);text-align:right}
  .pr .d{grid-column:1/3;flex-direction:column;align-items:flex-start;gap:.1vh;font-size:min(1.8vh,.85vw)}
  .ring{margin:.4vh 0 0}

  /* 下の数字も円グラフの下の左右の角へ：FCST と時点の計画は左に縦並び、着地見込みは右。円グラフはカードの下まで使う */
  .ft{position:absolute;bottom:1.2vh;left:1.2vw;right:1.2vw;width:auto;height:auto;margin:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:.8vh 0;align-items:end;pointer-events:none}
  .ft > div{text-align:left}
  .ft > div:nth-child(1){grid-column:1;grid-row:1}
  .ft > div:nth-child(2){grid-column:1;grid-row:2}
  .ft > div:nth-child(3){grid-column:3;grid-row:1/3;text-align:right;align-self:end}
  .ft span{font-size:min(1.8vh,.9vw)}
  .ft b{font-size:min(3.2vh,1.6vw);line-height:1.1}
  .ft > div:nth-child(3) b{font-size:min(4.6vh,2.3vw)}
  .ft > div:nth-child(3) small{display:block;font-size:min(2.2vh,1.1vw)}
  .ring{margin:.4vh 0 .6vh}

  /* OUT・IN のタグを大きく */
  .ttl .tag{font-size:min(3.4vh,1.8vw);font-weight:900;padding:.3vh 1.2vw;border-radius:99px;line-height:1.2}

  /* ===== CPT 別進捗（下の段） ===== */
  .cpc{flex:none;height:26vh;margin:0 .6vw .6vw;background:#fff;border-radius:1.2vh;box-shadow:0 2px 8px rgba(15,23,42,.18);padding:1vh 1.4vw;display:flex;flex-direction:column}
  .cpc[hidden]{display:none}
  .cpc h2{margin:0;font-size:min(3vh,1.6vw);font-weight:900;display:flex;gap:1.2vw;align-items:center;white-space:nowrap}
  .cpc h2 .warn{font-size:min(1.9vh,1vw);color:#b91c1c;font-weight:800}
  .cpc .lgd{display:flex;gap:1vw;font-size:min(1.9vh,1vw);font-weight:800;color:#334155;margin-left:auto}
  .cpc .lgd i{display:inline-block;width:2.2vh;height:1.4vh;border-radius:.3vh;margin-right:.3vw;vertical-align:-.1vh}
  .cpc svg{flex:1;width:100%;min-height:0}
  .cpc .lgd .lgn{color:#020617;border-left:2px solid #cbd5e1;padding-left:1vw}
  .cpc .none{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(2.6vh,1.4vw);font-weight:800;color:#64748b}

  /* 工程の枠：数字の桁が増えても切れないよう、枠は中身の幅に合わせる（文字は画面幅に合わせて小さくする） */
  .pr{max-width:none;overflow:visible}
  .pr .p{font-size:min(3.8vh,1.6vw)}
  .pr .n{font-size:min(2.3vh,.95vw)}
  .pr .d{font-size:min(1.8vh,.8vw)}

  /* 縦長ぎみの画面（5:4・4:3）でも、円グラフが角の枠・数字に重ならないよう横幅を抑える */
  .ring svg{max-width:74%}

  /* OUT・IN の札はカードの左上に寄せる（見出しと状態は中央のまま） */
  .ttl .tag{position:absolute;left:1.2vw;top:2vh}

  /* ===== OUT のフロア別オーダー（C4） ===== */
  .card .ttl.hsw{align-self:stretch;justify-content:flex-start;padding-left:calc(min(3.4vh,1.8vw) * 3.6);min-width:0;font-size:min(3.6vh,1.75vw);gap:.8vw}
  .card .ttl.hsw .st{font-size:min(3vh,1.5vw);padding:.3vh 1.6vw}
  .ttl .sw{margin-left:auto;display:flex;border:2px solid #cbd5e1;border-radius:99px;overflow:hidden;font-size:min(1.9vh,.9vw);font-weight:800;flex:none;cursor:pointer;user-select:none}
  .ttl .sw span{padding:.4vh .8vw;color:#64748b}.ttl .sw span.on{background:#0f172a;color:#fff}
  .flw{position:absolute;left:1.4vw;right:1.4vw;top:8.6vh;bottom:1.4vh;display:flex;flex-direction:column;gap:1.1vh}
  .flw .cp{display:grid;gap:.6vw}
  .flw .cp div{border-radius:1vh;padding:.6vh .6vw;background:#f1f5f9;border-bottom:.6vh solid var(--c);min-width:0;overflow:hidden}
  .flw .cp span{display:block;font-size:min(1.9vh,.95vw);font-weight:800;color:#334155;white-space:nowrap}
  .flw .cp b{display:block;white-space:nowrap;font-size:min(3.4vh,1.7vw);font-weight:900;font-variant-numeric:tabular-nums}
  .flw .cp .al{overflow:visible;padding-right:.9vw;background:#fff;color:#020617;border:2px solid #64748b;border-bottom-width:.6vh}.flw .cp .al span{color:#475569}
  .flw .frs{flex:1;display:grid;gap:.9vh;min-height:0}
  .flw .fr{display:grid;grid-template-columns:5.2vw 9vw minmax(0,1fr);align-items:center;gap:1vw;border-bottom:1px solid #e2e8f0;min-height:0}
  .flw .fn{font-size:min(4.4vh,2.3vw);font-weight:900}
  .flw .ft2{text-align:right;line-height:1.05}.flw .ft2 b{display:block;font-size:min(4.8vh,2.5vw);font-weight:900;font-variant-numeric:tabular-nums}
  .flw .ft2 small{font-size:min(1.7vh,.85vw);font-weight:800;color:#64748b}
  .flw .fb{height:62%;display:flex;border-radius:.8vh;overflow:hidden;background:#f1f5f9}
  .flw .fb i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:min(2vh,1vw);font-weight:900;white-space:nowrap;overflow:hidden;border-right:2px solid #fff}
  .flw .msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:min(2.4vh,1.3vw);font-weight:800;color:#64748b}
  .flw .stl{font-size:min(1.7vh,.85vw);font-weight:800;color:#b91c1c;text-align:right;margin-top:-.6vh}

  /* フロア別のときの右の枠：OUT・IN の円グラフを縦に2つ */
  .card.stk{padding:1vh 1.4vw;gap:.8vh;align-items:stretch}
  .mn{flex:1;min-height:0;display:flex;flex-direction:column}
  .mn + .mn{border-top:2px solid #e2e8f0;padding-top:.8vh}
  .mh{display:flex;align-items:center;gap:.8vw;white-space:nowrap;flex:none}
  .mh .tag{font-size:min(2.6vh,1.3vw);font-weight:900;color:#fff;background:var(--c);padding:.1vh .9vw;border-radius:99px}
  .mh .nm{font-size:min(2.8vh,1.4vw);font-weight:900}
  .mh .st{font-size:min(2.4vh,1.2vw);padding:.2vh 1.2vw}
  .mb{flex:1;min-height:0;display:flex;align-items:center;gap:1.2vw}
  .mr{height:100%;aspect-ratio:1;flex:none;display:flex;align-items:center;justify-content:center}
  .mr svg{height:100%;width:auto}
  .ms{flex:1;min-width:0;display:flex;flex-direction:column;gap:.8vh}
  .mp{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 .6vw;border-radius:1vh;background:#f1f5f9;border:2px solid #cbd5e1;padding:.6vh .8vw}
  .mp .n{font-size:min(2.2vh,1.05vw);font-weight:900;color:var(--pc)}
  .mp b{font-size:min(3.8vh,1.8vw);font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
  .mp small{grid-column:1/3;font-size:min(1.7vh,.85vw);font-weight:800;color:#334155;font-variant-numeric:tabular-nums}
  .ml{text-align:right;line-height:1.1}.ml span{display:block;font-size:min(1.8vh,.9vw);font-weight:800;color:#334155}
  .ml b{font-size:min(4vh,2vw);font-weight:900;font-variant-numeric:tabular-nums}.ml small{display:block;font-size:min(2vh,1vw);font-weight:800}

  /* 右の枠（フロア別のとき）：画面が低くても文字が重ならないよう、工程の枠を1行にして高さに合わせて縮める */
  .mh{position:relative;z-index:1;background:#fff}
  .mb{overflow:hidden}
  .ms{justify-content:center;gap:min(.8vh,.6vw)}
  .mp{display:flex;align-items:baseline;gap:.6vw;padding:min(.6vh,.4vw) .8vw;white-space:nowrap;min-width:0}
  .mp .n{font-size:min(2.2vh,1.05vw)}
  .mp small{font-size:min(1.8vh,.85vw);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mp b{font-size:min(3.4vh,1.7vw);margin-left:auto}
  .ml span{font-size:min(1.7vh,.85vw)}.ml b{font-size:min(3.6vh,1.8vw)}.ml small{font-size:min(1.8vh,.9vw)}
</style>
</head>
<body>
<header><div class="l"><h1>進捗モニター</h1><span class="sh" id="sh">—</span></div><span class="clk" id="clk">--:--</span><div class="r"><span class="at" id="at"></span><span class="wl off" id="wl" title="画面スリープ防止の状態。OFFのときは画面を一度クリックするとONになります">スリープ防止 OFF</span></div></header>
<main id="main"></main>
<section class="cpc" id="cpt"><h2>CPT別 残数</h2><div class="none">読み込み中…</div></section>
<script>
(() => {
  const API = 'https://indirect-relay-hfo1.takahiro884.workers.dev', KEY = '1540850d9c168e02e13c9c10c06d8bed';
  const COL = { Pick: '#0e7490', Pack: '#be185d', Receive: '#b45309', Stow: '#15803d' };
  const GRP = { out: { cats: ['Pick', 'Pack'], tag: 'OUT', name: 'アウトバウンド', c: '#0f766e' }, in: { cats: ['Receive', 'Stow'], tag: 'IN', name: 'インバウンド', c: '#ca8a04' } };
  const H = 3600000, nf = (v) => Math.round(v || 0).toLocaleString('ja-JP'), sg = (v) => (v >= 0 ? '+' : '−') + nf(Math.abs(v));
  const hm = (t) => new Date(t + 9 * H).toISOString().slice(11, 16);
  // 今のシフトと出勤日（日勤 8〜20時。それ以外は夜勤で、0〜8時は前日に出勤した夜勤）
  function cur() {
    const j = new Date(Date.now() + 9 * H), h = j.getUTCHours(), d = j.toISOString().slice(0, 10);
    if (h >= 8 && h < 20) return { sh: 'day', d };
    if (h >= 20) return { sh: 'night', d };
    return { sh: 'night', d: new Date(Date.now() + 9 * H - 24 * H).toISOString().slice(0, 10) };
  }
  const T = (D, i) => (D.starts ? D.starts[i] : D.start + i * H);
  const upto = (D) => (!D.dataTo ? 0 : D.hours.reduce((s, _, i) => s + Math.max(0, Math.min(1, (D.dataTo - T(D, i)) / H)), 0));
  const planTo = (a, h) => (a || []).reduce((s, v, i) => s + v * Math.max(0, Math.min(1, h - i)), 0);
  const left = (D, u) => (D.plan.work || D.hours.map(() => 1)).reduce((s, w, i) => s + w * Math.max(0, Math.min(1, i + 1 - u)), 0);
  const arc = (cx, cy, r, a0, a1) => { const p = (a) => [cx + r * Math.sin(a * 2 * Math.PI), cy - r * Math.cos(a * 2 * Math.PI)]; const [x0, y0] = p(a0), [x1, y1] = p(Math.min(a1, 0.9999)); return `M${x0},${y0} A${r},${r} 0 ${a1 - a0 > 0.5 ? 1 : 0} 1 ${x1},${y1}`; };
  function ring(G, done, fc, pr, stc) {
    // 外側の輪＝1つ目の工程、内側の輪＝2つ目の工程。黒い目盛り＝今の時点の計画
    const R = [158, 116], W = 38;
    let s = '';
    // 照準器のような目盛り：外側に細い円、上下左右は円をまたぐ長い線、内側にも細い円
    const ro = R[0] + W / 2 + 9, ri = R[1] - W / 2 - 7, gc = '#64748b';
    const ln = (d, a1, b1, w) => { const r = d * Math.PI / 180, sx = Math.sin(r), cy = -Math.cos(r); return `<line x1="${180 + a1 * sx}" y1="${180 + a1 * cy}" x2="${180 + b1 * sx}" y2="${180 + b1 * cy}" stroke="${gc}" stroke-width="${w}" stroke-linecap="round"/>`; };
    s += `<circle cx="180" cy="180" r="${ro}" fill="none" stroke="${gc}" stroke-width="1.5" opacity=".7"/>`;
    s += `<circle cx="180" cy="180" r="${ri}" fill="none" stroke="${gc}" stroke-width="1.2" opacity=".5"/>`;
    [0, 90, 180, 270].forEach((d) => { s += ln(d, ro - 6, ro + 16, 3) + ln(d, ri + 4, ri - 8, 3); });
    G.cats.forEach((c, k) => {
      const r = fc ? done[c] / fc : 0;
      s += `<circle cx="180" cy="180" r="${R[k]}" fill="none" stroke="#cbd5e1" stroke-width="${W}"/>`;
      if (r >= 1) {
        // 100% を超えたら：1周目は輪いっぱい、2周目も同じ色で上に重ねて伸ばす。白い境界線で重なりを見せる（最大200%まで）
        const r2 = Math.min(r - 1, 0.9999);
        s += `<circle cx="180" cy="180" r="${R[k]}" fill="none" stroke="${COL[c]}" stroke-width="${W}"/>`;
        if (r2 > 0) {
          // 境界線は伸びている先端（と両脇）だけ。2周目の始まり（0の位置）には線を出さない
          // 100% を少しだけ超えたとき（伸びがごく短いとき）も、先端の丸と白い境界線は他と同じように出す
          const ea = r2 * 2 * Math.PI, ex = 180 + R[k] * Math.sin(ea), ey = 180 - R[k] * Math.cos(ea);
          if (r2 > 0.006) s += `<path d="${arc(180, 180, R[k], 0.006, r2)}" fill="none" stroke="#fff" stroke-width="${W + 6}" stroke-linecap="butt"/>`;
          // 先端の丸が 0 の位置より左（2周目の始まりより前）にはみ出す分は切り落とす
          const cid = `cap-${G.tag}-${k}`, near = r2 < 0.12;
          if (near) s += `<clipPath id="${cid}"><rect x="180" y="-20" width="220" height="400"/></clipPath>`;
          const cp = near ? ` clip-path="url(#${cid})"` : '';
          s += `<circle cx="${ex}" cy="${ey}" r="${W / 2 + 3}" fill="#fff"${cp}/>`;
          s += `<path d="${arc(180, 180, R[k], -0.004, r2)}" fill="none" stroke="${COL[c]}" stroke-width="${W}" stroke-linecap="butt"/><circle cx="${ex}" cy="${ey}" r="${W / 2}" fill="${COL[c]}"${cp}/>`;
        }
      } else if (r > 0) s += `<path d="${arc(180, 180, R[k], 0, r)}" fill="none" stroke="${COL[c]}" stroke-width="${W}" stroke-linecap="round"/>`;
    });

    const bn = G.cats.reduce((a, b) => (done[b] < done[a] ? b : a)), p = fc ? Math.round(done[bn] / fc * 100) : null;
    s += `<text x="180" y="190" text-anchor="middle" font-size="${p != null && p >= 100 ? 58 : 72}" font-weight="900" fill="${stc}">${p == null ? '—' : p + '%'}</text>`;
    s += `<text x="180" y="226" text-anchor="middle" font-size="22" font-weight="800" fill="#1e293b">${fc ? `計画 ${Math.round(pr * 100)}%` : 'FCST なし'}</text>`;
    return `<svg viewBox="-20 -20 400 400">${s}</svg>`;
  }

  // フロア別のとき、右の枠に OUT・IN の円グラフを縦に並べる（円グラフ＋工程ごとの％・着地見込み）
  function mini(D, g) {
    const G = GRP[g], fc = D.plan[g + 'Sum'], u = upto(D), pn = planTo(D.plan[g], u), pr = fc ? Math.min(1, pn / fc) : null;
    const done = {}, land = {};
    G.cats.forEach((c) => { done[c] = D.hours.reduce((s, h) => s + h[c].u, 0); land[c] = D.live ? done[c] + (D.recent[c].u / Math.max(0.25, (D.recentTo - D.recentFrom) / H)) * left(D, u) : done[c]; });
    const bn = G.cats.reduce((a, b) => (done[b] < done[a] ? b : a)), diff = done[bn] - pn;
    const st = !fc ? ['na', 'FCST なし'] : diff >= 0 ? ['ok', '計画どおり'] : diff > -pn * 0.06 ? ['wn', 'やや遅れ'] : ['ng', '遅れ'];
    const stc = { ok: '#15803d', wn: '#ea580c', ng: '#dc2626', na: '#020617' }[st[0]];
    const lb = Math.min(...G.cats.map((c) => land[c]));
    return `<div class="mn" style="--c:${G.c}"><div class="mh"><span class="tag">${G.tag}</span><span class="nm">${G.name}</span><span class="st ${st[0]}">${st[1]}${fc ? `　${sg(diff)}` : ''}</span></div>
      <div class="mb"><div class="mr">${ring(G, done, fc, pr, stc)}</div><div class="ms">
        ${G.cats.map((c) => `<div class="mp" style="--pc:${COL[c]}"><span class="n">● ${c}</span><small>${nf(done[c])} / ${fc ? nf(fc) : '—'}</small><b>${fc ? Math.round(done[c] / fc * 100) + '%' : '—'}</b></div>`).join('')}
        <div class="ml"><span>着地見込み</span><b style="color:${fc ? (lb >= fc ? '#15803d' : '#dc2626') : ''}">${nf(lb)}</b>${fc ? `<small style="color:${lb >= fc ? '#16a34a' : '#dc2626'}">${sg(lb - fc)}</small>` : ''}</div>
      </div></div></div>`;
  }
  function card(D, g) {
    const G = GRP[g], fc = D.plan[g + 'Sum'], u = upto(D), pn = planTo(D.plan[g], u), pr = fc ? Math.min(1, pn / fc) : null;
    const done = {}, land = {};
    G.cats.forEach((c) => { done[c] = D.hours.reduce((s, h) => s + h[c].u, 0); land[c] = D.live ? done[c] + (D.recent[c].u / Math.max(0.25, (D.recentTo - D.recentFrom) / H)) * left(D, u) : done[c]; });
    const bn = G.cats.reduce((a, b) => (done[b] < done[a] ? b : a)), diff = done[bn] - pn;
    const st = !fc ? ['na', 'FCST なし'] : diff >= 0 ? ['ok', '計画どおり'] : diff > -pn * 0.06 ? ['wn', 'やや遅れ'] : ['ng', '遅れ'];
    const stc = { ok: '#15803d', wn: '#ea580c', ng: '#dc2626', na: '#020617' }[st[0]];
    const lb = Math.min(...G.cats.map((c) => land[c]));
    const uph = (c) => { const o = D.recent[c]; return o && o.h > 0.05 ? Math.round(o.u / o.h) : '—'; };
    const sw = g === 'out' ? `<span class="sw" onclick="setOutView('toggle')"><span class="${OUTV === 'floor' ? '' : 'on'}">全体</span><span class="${OUTV === 'floor' ? 'on' : ''}">フロア別</span></span>` : '';
    const head = `<div class="card" style="--c:${G.c}"><div class="ttl${sw ? ' hsw' : ''}"><span class="tag">${G.tag}</span>${G.name}<span class="st ${st[0]}">${st[1]}${fc ? `　${sg(diff)}` : ''}</span>${sw}</div>`;
    if (g === 'out' && OUTV === 'floor') return head.replace(/<span class="st [^"]*">[\s\S]*?<\/span>(?=<span class="sw")/, '') + `<div class="flw" id="flw">${floorHtml()}</div></div>`;
    return head + `
      <div class="ring">${ring(G, done, fc, pr, stc)}</div>
      <div class="rows">${G.cats.map((c) => `<div class="pr" style="--pc:${COL[c]}"><span class="n">● ${c}</span><span class="p">${fc ? Math.round(done[c] / fc * 100) + '%' : '—'}</span><span class="d"><span><b>${nf(done[c])}</b> / ${fc ? nf(fc) : '—'}</span><span>UPH <b>${uph(c)}</b>・${D.recent[c].n}名</span></span></div>`).join('')}</div>
      <div class="ft"><div><span>FCST</span><b>${fc ? nf(fc) : '—'}</b></div><div><span>${hm(D.dataTo || D.start)} 時点の計画</span><b>${fc ? nf(pn) : '—'}</b></div><div><span>着地見込み</span><b style="color:${fc ? (lb >= fc ? '#15803d' : '#dc2626') : ''}">${nf(lb)}</b>${fc ? `<small style="color:${lb >= fc ? '#16a34a' : '#dc2626'}">${sg(lb - fc)}</small>` : ''}</div></div></div>`;
  }
  let LASTD = null;
  const mainHtml = (D) => OUTV === 'floor' ? card(D, 'out') + `<div class="card stk">${mini(D, 'out')}${mini(D, 'in')}</div>` : card(D, 'out') + card(D, 'in');
  async function load() {
    const { sh, d } = cur();
    try {
      const r = await fetch(`${API}/api/progress?date=${d}&shift=${sh}&cut=0&k=${KEY}`, { cache: 'no-store' });
      const D = await r.json(); if (!D.ok) throw new Error(D.error || 'error');
      document.getElementById('sh').textContent = `${Number(d.slice(5, 7))}/${Number(d.slice(8))} ${sh === 'day' ? '日勤 8:00〜20:00' : '夜勤 20:00〜5:00'}`;
      document.getElementById('at').textContent = D.dataTo ? `${hm(D.dataTo)} までの実績` : '実績はまだありません';
      LASTD = D;

      if (OUTV === 'floor') loadOrders();
    } catch (e) { document.getElementById('at').textContent = '読み込めませんでした（' + e.message + '）'; }
  }

  // ===== CPT 別進捗（Rodeo の Work Pool by ExSD から、間接打刻管理の /api/cpt で読む） =====
  //  ・CPT は等間隔に並べる。今の時刻（15分単位に切り捨て）を左から3番目の位置に固定し、前後の CPT の間を時間の割合で進む
  //    → 15分ごとに少しずつ左へずれ、左端は隠れ、右端から次の CPT が出てくる
  //  ・棒は CPT ごとに左＝Pick、右＝Pack。高さ＝その CPT の総数、色の部分＝処理済み（Pick＝ピック済み、Pack＝パック済み）
  //  ・終わった CPT は実績の高さのまま残し、今に近いほど濃く、離れるほど薄くする
  //  ・日勤・夜勤の区切りとは関係なく続いていく
  const CPT_SLOTS = 11, PK = COL.Pick, PC = COL.Pack;
  const jstYmd = (t) => new Date(t + 9 * H).toISOString().slice(0, 10);
  function cptSvg(list, nowF) {
    const W = 1800, Hh = 252, base = 162, w = W / CPT_SLOTS;
    let ip = -1; list.forEach((c, i) => { if (c.t <= nowF) ip = i; });
    const fNow = ip < 0 ? (list.length ? -0.5 : 0) : ip + 1 >= list.length ? ip + 0.5 : ip + (nowF - list[ip].t) / (list[ip + 1].t - list[ip].t);
    const xNow = 2.5 * w, X = (i) => xNow + (i - fNow) * w;
    const vis = list.map((c, i) => ({ ...c, i })).filter((c) => X(c.i) > -w && X(c.i) < W + w);
    const mx = Math.max(1, ...vis.map((c) => c.tot)), k = 80 / mx, bw = 38, gp = 24, today = jstYmd(nowF);
    let s = `<defs><clipPath id="cpw"><rect x="0" y="-20" width="${W}" height="${Hh + 40}"/></clipPath><linearGradient id="cpfl" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#cpw)">`;
    s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#94a3b8" stroke-width="2"/>`;
    const placed = [], pb = [], pb2 = [];
    for (const c of vis) {
      const x = X(c.i), ht = Math.max(4, c.tot * k), fin = c.done || !(c.np + c.pp);
      const op = !fin ? 1 : (x > xNow - w * 1.2 ? 0.6 : x > xNow - w * 2.2 ? 0.32 : 0.18);
      s += `<g opacity="${op}">`;
      s += `<rect x="${x - bw - gp / 2}" y="${base - ht}" width="${bw}" height="${ht}" rx="3" fill="#e5e7eb"/><rect x="${x + gp / 2}" y="${base - ht}" width="${bw}" height="${ht}" rx="3" fill="#e5e7eb"/>`;
      const tot = Math.max(1, c.tot), hp = Math.max(0, (c.tot - c.np) / tot) * ht, hk = Math.max(0, (c.tot - c.np - c.pp) / tot) * ht;
      // 残りを色で（棒の上側から）：左＝Pick 残（未ピック）、右＝Pack 残（未ピック＋ピック済みでパック待ち＝まだパックしていない数）
      const rp = (c.np / tot) * ht, rk = ((c.np + c.pp) / tot) * ht;
      if (rp > 0) s += `<rect x="${x - bw - gp / 2}" y="${base - ht}" width="${bw}" height="${Math.max(3, rp)}" rx="3" fill="${PK}"/>`;
      if (rk > 0) s += `<rect x="${x + gp / 2}" y="${base - ht}" width="${bw}" height="${Math.max(3, rk)}" rx="3" fill="${PC}"/>`;
      // 残数：左の棒の上に Pick、右の棒の上に Pack（見出しと数字の2段）。棒の色とは別の色（黒・グレー）で書く
      if (!fin) {
        const yb = base - ht - 6, xl = x - bw / 2 - gp / 2, xr = x + bw / 2 + gp / 2;
        s += `<text x="${xl}" y="${yb - 24}" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">Pick</text><text x="${xl}" y="${yb - 3}" text-anchor="middle" font-size="20" font-weight="900" fill="#020617">${nf(c.np)}</text>`;
        s += `<text x="${xr}" y="${yb - 24}" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">Pack</text><text x="${xr}" y="${yb - 3}" text-anchor="middle" font-size="20" font-weight="900" fill="#020617">${nf(c.np + c.pp)}</text>`;
      }
      // 時刻と棒の間：処理数。左の棒の下＝Pick 済み（総数 − Pick 残）、右の棒の下＝Pack 済み（総数 − Pick 残 − Pack 残）
      const xl2 = x - bw / 2 - gp / 2, xr2 = x + bw / 2 + gp / 2;
      s += `<text x="${xl2}" y="${base + 22}" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">${nf(Math.max(0, c.tot - c.np))}</text><text x="${xr2}" y="${base + 22}" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">${nf(Math.max(0, c.tot - c.np - c.pp))}</text>`;
      const row = 0;
      const dd = Math.round((Date.parse(jstYmd(c.t)) - Date.parse(today)) / 86400000), pre = dd === 1 ? '翌' : dd === -1 ? '前日' : dd ? `${Number(jstYmd(c.t).slice(5, 7))}/${Number(jstYmd(c.t).slice(8))} ` : '';
      s += `<text x="${x}" y="${base + 52 + row * 26}" text-anchor="middle" font-size="24" font-weight="900" fill="#020617">${pre ? `<tspan font-size="17" fill="#64748b">${pre}</tspan>` : ''}${hm(c.t).replace(/^0/, '')}</text></g>`;
    }
    s += `<line x1="${xNow}" x2="${xNow}" y1="28" y2="${base + 8}" stroke="#020617" stroke-width="3" stroke-dasharray="6 5"/><rect x="${xNow - 40}" y="0" width="80" height="28" rx="14" fill="#0f172a"/><text x="${xNow}" y="21" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">${hm(nowF).replace(/^0/, '')}</text>`;
    s += `<rect x="0" y="-20" width="70" height="${Hh + 40}" fill="url(#cpfl)"/></g>`;
    return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${s}</svg>`;
  }
  async function loadCpt() {
    const el = document.getElementById('cpt');
    const lg = `<span class="lgd"><span><i style="background:${PK}"></i>Pick 残</span><span><i style="background:${PC}"></i>Pack 残（未Pick含む）</span><span><i style="background:#e5e7eb;border:1px solid #cbd5e1"></i>処理済み</span><span class="lgn">棒の上＝残数・下＝<span style="color:#1d4ed8">処理数</span></span></span>`;
    try {
      const r = await fetch(`${API}/api/cpt?k=${KEY}`, { cache: 'no-store' });
      const D = await r.json(); if (!D.ok) throw new Error(D.error || 'error');
      const nowF = Math.floor(Date.now() / (15 * 60000)) * 15 * 60000;
      // Rodeo からの更新が30分以上止まっていたら知らせる
      const stale = !D.syncAt || Date.now() - D.syncAt > 30 * 60000;
      const warn = stale ? `<span class="warn">${D.syncAt ? `Rodeo からの更新が止まっています（最終 ${hm(D.syncAt)}）` : 'Rodeo からのデータがまだありません'}</span>` : '';
      el.innerHTML = `<h2>CPT別 残数${warn}${lg}</h2>` + (D.cpts.length ? cptSvg(D.cpts, nowF) : '<div class="none">表示できる CPT がありません（Rodeo の画面とスクリプトを確認してください）</div>');
    } catch (e) {
      el.innerHTML = `<h2>CPT別 残数${lg}</h2><div class="none">読み込めませんでした（${String(e.message || e)}）</div>`;
    }
  }

  // ===== OUT のフロア別オーダー（C4 の階層別・CPT 別オーダー数。モバイル版の「オーダー」と同じデータ）=====
  //  ・見出しの「全体｜フロア別」で切り替える（この端末に記憶）
  //  ・数えるのはシフト内の CPT（日勤＝当日20:00まで、夜勤＝翌朝8:00まで）と Passed。Future などシフト外は数えない
  //  ・切り替えた表示は URL の末尾（#floor）とこの端末の両方に覚えておき、データの読み直しやページの再読み込みでも戻らない
  let OUTV = 'all';
  if (/floor/i.test(location.hash)) OUTV = 'floor';
  else if (/all/i.test(location.hash)) OUTV = 'all';
  else { try { if (localStorage.getItem('mon_out_view') === 'floor') OUTV = 'floor'; } catch (e) { /* 無視 */ } }
  let ORD = null, ORDERR = '';
  const ORD_CC = ['#0f766e', '#2563eb', '#7c3aed', '#d97706', '#db2777', '#0891b2', '#65a30d'];
  window.setOutView = (v) => setOutView(v);
  function setOutView(v) { if (v === 'toggle') v = OUTV === 'floor' ? 'all' : 'floor'; OUTV = v; try { localStorage.setItem('mon_out_view', v); } catch (e) { /* 無視 */ }
    try { history.replaceState(null, '', location.pathname + location.search + '#' + v); } catch (e) { /* 無視 */ } if (LASTD) document.getElementById('main').innerHTML = mainHtml(LASTD); if (v === 'floor') loadOrders(); }
  function ordCut() {
    const j = new Date(Date.now() + 9 * H), hh = j.getUTCHours(), base = Date.parse(j.toISOString().slice(0, 10) + 'T00:00:00+09:00');
    if (hh >= 8 && hh < 20) return base + 20 * H;            // 日勤：当日 20:00 まで
    return hh >= 20 ? base + 32 * H : base + 8 * H;           // 夜勤：翌朝 8:00 まで
  }
  function ordCols() {
    if (!ORD) return [];
    const now = Date.now(), cut = ordCut();
    return ORD.header.map((h, i) => {
      if (i === ORD.iPP || i === ORD.iPA || !String(h).trim()) return null;
      const m = String(h).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
      const t = m ? Date.parse(`${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}T${m[4].padStart(2, '0')}:${m[5]}:00+09:00`) : null;
      const passed = /passed/i.test(h), future = /future/i.test(h);
      const inShift = !future && (passed || t == null || t <= cut);
      const label = passed ? 'Passed' : future ? 'Future' : t ? hm(t).replace(/^0/, '') : (String(h).split(/\n/)[0].replace(/\s*CPT\s*/i, '').trim() || String(h));
      return { i, t, passed, label, inShift, late: passed || (t != null && t < now) };
    }).filter((x) => x && x.inShift);
  }

  function fitCp() { const bs = [...document.querySelectorAll('.flw .cp b')]; if (!bs.length) return; bs.forEach((b) => { b.style.fontSize = ''; }); let f = parseFloat(getComputedStyle(bs[0]).fontSize), n = 0; while (n++ < 25 && f > 8 && bs.some((b) => b.scrollWidth > b.clientWidth + 1)) { f *= 0.94; bs.forEach((b) => { b.style.fontSize = f + 'px'; }); } }
  window.addEventListener('resize', () => fitCp());
  function floorHtml() {
    if (!ORD) return `<div class="msg">${ORDERR ? 'フロア別オーダーを読み込めませんでした（' + ORDERR + '）' : '読み込み中…'}</div>`;
    if (!ORD.floors.length) return '<div class="msg">オーダーのデータがありません<br>（C4 の画面からの送信を待っています）</div>';
    const L = ordCols();
    let k = 0; L.forEach((x) => { x.c = x.passed ? '#dc2626' : ORD_CC[k++ % ORD_CC.length]; });
    const fl = ORD.floors.map((f) => ({ f: f.f, v: L.map((x) => f.sum[x.i] || 0), air: L.reduce((s, x) => s + (f.air[x.i] || 0), 0) }));
    fl.forEach((x) => { x.t = x.v.reduce((a, b) => a + b, 0); });
    const mx = Math.max(1, ...fl.map((x) => x.t)), all = fl.reduce((s, x) => s + x.t, 0);
    const age = ORD.at ? (Date.now() - ORD.at) / 60000 : null;
    let h = `<div class="cp" style="grid-template-columns:repeat(${L.length},minmax(0,1fr)) auto">${L.map((x) => `<div style="--c:${x.c}"><span>${x.label}</span><b>${nf(fl.reduce((s, f) => s + f.v[L.indexOf(x)], 0))}</b></div>`).join('')}<div class="al"><span>合計</span><b>${nf(all)}</b></div></div>`;
    if (age == null || age > 10) h += `<div class="stl">C4 からの更新が止まっています${ORD.at ? `（最終 ${hm(ORD.at)}）` : ''}</div>`;
    h += `<div class="frs" style="grid-template-rows:repeat(${fl.length},1fr)">${fl.map((x) => `<div class="fr"><span class="fn">${x.f}</span><span class="ft2"><b>${nf(x.t)}</b><small>Air ${nf(x.air)}</small></span>
      <div class="fb" style="width:${Math.max(x.t ? 2 : 0, x.t / mx * 100).toFixed(1)}%">${x.v.map((v, j) => v ? `<i style="width:${(v / x.t * 100).toFixed(2)}%;background:${L[j].c}">${v / mx > 0.07 ? nf(v) : ''}</i>` : '').join('')}</div></div>`).join('')}</div>`;
    return h;
  }
  async function loadOrders() {
    if (OUTV !== 'floor') return;
    try {
      const r = await fetch(`${API}/api/orders?k=${KEY}`, { cache: 'no-store' });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error');
      ORD = j; ORDERR = '';
    } catch (e) { ORDERR = String(e.message || e); }
    const el = document.getElementById('flw'); if (el) el.innerHTML = floorHtml(); fitCp();
  }
  const tick = () => { document.getElementById('clk').textContent = new Date(Date.now() + 9 * H).toISOString().slice(11, 16); };

  // ===== 画面スリープ防止 =====
  // 1) Screen Wake Lock API（Chrome・Edge・Safari 16.4 以降）。タブが隠れると外れるので、戻ったら取り直す
  // 2) 使えないブラウザでは、見えない無音の動画を流し続けて画面が消えないようにする（最初に一度クリックが必要）
  let wl = null, vid = null;
  const wlShow = (on) => { const e = document.getElementById('wl'); e.className = 'wl ' + (on ? 'on' : 'off'); e.textContent = on ? 'スリープ防止 ON' : 'スリープ防止 OFF（画面をクリック）'; };
  async function wakeOn() {
    if ('wakeLock' in navigator) {
      try {
        if (!wl || wl.released) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { if (document.visibilityState !== 'visible') wlShow(false); }); }
        wlShow(true); return;
      } catch (e) { /* 使えない・許可されないときは動画で代わりにする */ }
    }
    try {
      if (!vid) {
        const c = document.createElement('canvas'); c.width = c.height = 2; const x = c.getContext('2d');
